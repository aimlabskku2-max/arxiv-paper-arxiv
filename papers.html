<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>논문 리스트 — arXiv Paper Archive</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#6366f1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1120; --card:#131b2e; --ink:#e8edf6; --muted:#94a3b8; --line:#243049; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  header.top { background:linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:34px 20px 26px; }
  header.top .inner { max-width:1040px; margin:0 auto; }
  header.top a.home { color:#cbd5e1; text-decoration:none; font-size:13px; }
  header.top a.home:hover { color:#fff; }
  header.top h1 { margin:8px 0 4px; font-size:24px; }
  header.top p { margin:0; color:#cbd5e1; font-size:13.5px; }
  .wrap { max-width:1040px; margin:0 auto; padding:20px 20px 64px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:6px 0 16px; }
  #q { flex:1; min-width:220px; padding:10px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--ink); font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
    font-size:12.5px; padding:5px 11px; border-radius:20px; user-select:none; }
  .chip.active { color:#fff; border-color:transparent; }
  .count { color:var(--muted); font-size:13px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; font-size:13.5px; }
  thead th { text-align:left; background:#f1f5f9; color:#0f172a; font-weight:700; padding:10px 12px;
    border-bottom:2px solid #cbd5e1; white-space:nowrap; cursor:pointer; }
  @media (prefers-color-scheme: dark) { thead th { background:#1b2740; color:#e8edf6; } }
  tbody td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover { background:rgba(99,102,241,.06); }
  .tp { display:inline-block; color:#fff; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .ttl { font-weight:600; }
  .ttl .lead { display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px; }
  .date { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--muted); }
  .lk a { color:var(--accent); text-decoration:none; font-size:12.5px; margin-right:8px; white-space:nowrap; }
  .lk a:hover { text-decoration:underline; }
  .empty { text-align:center; color:var(--muted); padding:40px; }
  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:28px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<header class="top"><div class="inner">
  <a class="home" href="index.html">← 메인으로</a>
  <h1>📄 전체 논문 리스트</h1>
  <p>모든 주차 디제스트의 논문을 한곳에서 검색·필터로 관리</p>
</div></header>
<div class="wrap">
  <div class="controls">
    <input id="q" type="search" placeholder="제목·저자·arXiv ID·학회 검색…" oninput="render()">
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <table>
    <thead><tr>
      <th onclick="sortBy('week')">주차 ▾</th>
      <th onclick="sortBy('topic')">주제</th>
      <th onclick="sortBy('title')">제목</th>
      <th onclick="sortBy('pub')">출판일</th>
      <th onclick="sortBy('venue')">학회</th>
      <th>링크</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">조건에 맞는 논문이 없어요.</div>
  <footer><a href="index.html">메인 페이지</a> · <a href="https://github.com/aimlabskku2-max/arxiv-paper-arxiv">GitHub</a></footer>
</div>
<script>
const PAPERS = [{"title": "Improving and Evaluating Hand-Object Interaction Detection", "arxiv": "2606.17384", "topic": "Hand-Object Interaction", "pub": "2026-06-16", "venue": "프리프린트", "authors": "Ahmad Darkhalil (University of Bristol), Dima Damen (University of Bristol), David Fouhey (New York University)", "lead": "Transformer 기반 HOI-DETR 하나로 손, 손이 직접 잡은 물체(1st object), 도구를 거쳐 조작되는 물체(2nd object)와 이들 사이의 상호작용 관계까지 한꺼번에 검출하고, 여기에 정제한 데이터셋과 프레임/비디오 단위 평가 프로토콜을 함께 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "EgoPhys: Learning Generalizable Physics Models of Deformable Objects from Egocentric Video", "arxiv": "2606.16202", "topic": "Egocentric Vision", "pub": "2026-06-15", "venue": "프리프린트", "authors": "Hyunjin Kim, Ri-Zhao Qiu, Guangqi Jiang, Xiaolong Wang (UC San Diego)", "lead": "사람이 물체를 직접 만지며 촬영한 1인칭(egocentric) RGB 영상 한 편만으로 변형 물체(deformable object, 형태가 바뀌는 물체)의 물리적 디지털 트윈(physical digital twin, 실제 물체의 물리 거동을 그대로 재현하는 가상 모델)을 만들고, 코드북(codebook) 기반 물리 프라이어를 통해 처음 보는 물체에도 스프링별 재최적화 없이 곧바로 적용되는 물리 모델을 학습하는 프레임워크다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Probing Spatial Structure in Pretrained Audio Representations", "arxiv": "2606.05544", "topic": "Spatial Audio", "pub": "2026-06-04", "venue": "Interspeech 2026", "authors": "Chuyang Chen, Sivan Ding, Adrian S. Roman, Juan Pablo Bello (Music and Audio Research Laboratory, New York University, USA) — Chen, Ding, Roman은 공동 1저자", "lead": "사전학습된 오디오 모델의 frozen embedding에 공간(spatial) 정보가 얼마나 담겨 있는지를, 가벼운 linear probing(표현 안에 어떤 정보가 들어 있는지 진단하는 방법)으로 요인별로 나눠 측정하는 SARL(Spatial Audio Representation Learning) 벤치마크를 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "CHOIR: Contact-aware 4D Hand-Object Interaction Reconstruction", "arxiv": "2605.20992", "topic": "Hand-Object Interaction", "pub": "2026-05-20", "venue": "프리프린트", "authors": "Hao Xu (The Chinese University of Hong Kong), Yilin Liu (University College London), Yinqiao Wang (The Chinese University of Hong Kong), Chi-Wing Fu (The Chinese University of Hong Kong), Niloy J. Mitra (University College London, Adobe Research)", "lead": "한 대의 카메라로 찍은 단안(monocular) RGB 영상만으로 손의 관절 움직임, 물체의 형상과 6D 포즈 궤적, 접촉(손이 물체에 닿는 지점)을 한꺼번에 복원한다. 이때 접촉을 손과 물체를 잇는 명시적 신호로 삼아 둘의 정렬과 물리적 자연스러움을 끌어올리는 open-world 4D Hand-Object Interaction 복원 프레임워크다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Towards Streaming Synchronized Spatial Audio Generation via Autoregressive Diffusion Transformer", "arxiv": "2605.30940", "topic": "Spatial Audio", "pub": "2026-05", "venue": "프리프린트", "authors": "Ke Lei, Yu Zhang, Changhao Pan, Xueyi Pu, Wenxiang Guo, Ruiqi Li, Zhou Zhao (Zhejiang University 등; 제공된 본문 excerpt에는 개별 소속이 명시적으로 표기되어 있지 않음)", "lead": "360도 파노라마 비디오와 텍스트를 입력받아 4채널 FOA(First-Order Ambisonics, 1차 앰비소닉스) 공간 음향을 낮은 지연으로 스트리밍 생성하는 causal autoregressive diffusion transformer 프레임워크 SwanSphere를 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Ego-1K – A Large-Scale Multiview Video Dataset for Egocentric Vision", "arxiv": "2603.13741", "topic": "Egocentric Vision", "pub": "2026-03-14", "venue": "프리프린트", "authors": "Jae Yong Lee, Daniel Scharstein, Akash Bapat, Hao Hu, Andrew Fu, Haoru Zhao, Paul Sammut, Xiang Li, Stephen Jeapes, Anik Gupta, Lior David, Saketh Madhuvarasu, Jay Girish Joshi, Jason Wither (전원 Meta Reality Labs 소속)", "lead": "사용자가 쓴 VR 헤드셋(카메라 4개)을 동기화된 카메라 12개로 빙 둘러싼 커스텀 rig로 촬영해, 시간이 맞춰진 egocentric(1인칭 시점) multiview 비디오 약 1,000개를 모은 데이터셋이다. neural 3D/4D video synthesis와 동적 장면 이해를 위한 벤치마크로 쓸 수 있다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}];
const COLORS = {"Hand-Object Interaction": "#10b981", "Egocentric Vision": "#0ea5e9", "Spatial Audio": "#6366f1"};
let activeTopic = "ALL";
let sortKey = "week", sortDir = -1;

function esc(s) { return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildChips() {
  const box = document.getElementById("chips");
  const topics = ["ALL", ...Object.keys(COLORS)];
  box.innerHTML = topics.map(t => {
    const c = t === "ALL" ? "#334155" : COLORS[t];
    const style = t === activeTopic ? `background:${c}` : "";
    const cls = t === activeTopic ? "chip active" : "chip";
    return `<span class="${cls}" style="${style}" onclick="setTopic('${t.replace(/'/g,"\\'")}')">${t==="ALL"?"전체":esc(t)}</span>`;
  }).join("");
}
function setTopic(t) { activeTopic = t; buildChips(); render(); }
function sortBy(k) { if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==="week"||k==="pub")?-1:1; } render(); }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let list = PAPERS.filter(p => activeTopic==="ALL" || p.topic===activeTopic);
  if (q) list = list.filter(p => (p.title+" "+p.authors+" "+p.arxiv+" "+p.venue+" "+p.lead).toLowerCase().includes(q));
  list.sort((a,b) => { const x=(a[sortKey]||""), y=(b[sortKey]||""); return x<y?-sortDir:x>y?sortDir:0; });
  const rows = document.getElementById("rows");
  rows.innerHTML = list.map(p => {
    const c = COLORS[p.topic] || "#64748b";
    const links = [];
    if (p.arxiv) {
      links.push(`<a href="https://arxiv.org/abs/${p.arxiv}" target="_blank">arXiv</a>`);
      links.push(`<a href="https://arxiv.org/pdf/${p.arxiv}" target="_blank">PDF</a>`);
    }
    if (p.report) links.push(`<a href="${esc(p.report)}#${""}" target="_blank">리포트</a>`);
    return `<tr>
      <td class="date">${esc(p.week)}</td>
      <td><span class="tp" style="background:${c}">${esc(p.topic)}</span></td>
      <td class="ttl">${esc(p.title)}${p.lead?`<span class="lead">${esc(p.lead)}</span>`:""}</td>
      <td class="date">${esc(p.pub)}</td>
      <td>${esc(p.venue)}</td>
      <td class="lk">${links.join("")}</td>
    </tr>`;
  }).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("count").textContent = `${list.length}편 / 전체 ${PAPERS.length}편`;
}
buildChips(); render();
</script>
</body>
</html>
