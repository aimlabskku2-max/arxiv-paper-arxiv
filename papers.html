<script>
const PAPERS = [{"title": "S-EMBER: A Large-Scale Benchmark for Streaming Egocentric Memory Retrieval", "arxiv": "2607.02689", "topic": "Egocentric Vision", "pub": "2026-07-02", "venue": "프리프린트", "authors": "Xiaodong Wang, Xuanyi Zhao, Pedro Rodriguez, Devendra Singh Sachan, Barlas Oguz, Seungwhan Moon, Shang-Wen Li, Gargi Ghosh, Xin Dong, Wen-Tau Yih 외 (FAIR, Meta / Reality Labs, Meta)", "lead": "Ray-Ban Meta 스마트 안경으로 촬영한 388시간짜리 1인칭 영상에 기반해, AI가 \"스트리밍\" 상황에서 과거 경험을 떠올리고(episodic memory) 그 근거가 되는 영상 구간까지 정확히 짚어내야 하는 새로운 벤치마크 S-EMBER를 제안한 논문이다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "LIME: Learning Intent-aware Camera Motion from Egocentric Video", "arxiv": "2607.02417", "topic": "Egocentric Vision", "pub": "2026-07-02", "venue": "프리프린트", "authors": "Boyang Sun, Jiajie Li, Yung-Hsu Yang, Chenyangguang Zhang, Tim Engelbracht, Sunghwan Hong, Cesar Cadena, Marc Pollefeys, Hermann Blum (ETH Zurich, Microsoft, University of Bonn)", "lead": "사람이 찍은 일상 1인칭(egocentric) 영상만으로, \"자연어로 표현된 의도(intent)에 맞게 카메라를 어디로 움직여야 다음 관측이 더 유용한지\"를 학습하는 vision-language 모델 LIME을 제안한다. 즉 카메라 움직임 자체를 하나의 독립된 행동(action)으로 다룬다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "SpatialV2A: Visual-Guided High-fidelity Spatial Audio Generation", "arxiv": "2601.15017", "topic": "Spatial Audio", "pub": "2026-01-21", "venue": "프리프린트", "authors": "Yanan Wang, Linjie Ren, Zihao Li, Junyi Wang, Tian Gan (School of Computer Science and Technology, Shandong University / 산둥대학교)", "lead": "영상을 보고 소리를 만드는 Video-to-Audio(V2A, 영상→오디오 생성) 기술이 지금까지 놓쳤던 \"공간감(spatial perception)\"을 정면으로 다룬 연구다. 대규모 양이(binaural, 좌·우 두 채널로 방향감을 주는) 데이터셋 BinauralVGGSound를 새로 만들고, 영상 속 소리 위치 단서를 활용해 의미·시간 정합을 유지하면서도 입체적인 양이 오디오를 생성하는 SpatialV2A 프레임워크를 제안한다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "ViSAudio: End-to-End Video-Driven Binaural Spatial Audio Generation", "arxiv": "2512.03036", "topic": "Spatial Audio", "pub": "2025-12-02", "venue": "프리프린트 (arXiv, cs.CV)", "authors": "Mengchen Zhang(Zhejiang University, Shanghai AI Laboratory), Qi Chen(Shanghai Jiao Tong University, Shanghai Innovation Institute), Tong Wu(Stanford University), Zihan Liu(Beihang University, Shanghai AI Laboratory), Dahua Lin(Shanghai AI Laboratory, The Chinese University of Hong Kong)", "lead": "무음 영상만 보고 곧바로 좌우 두 귀에 맞는 입체 음향(binaural spatial audio, 두 귀로 듣는 것처럼 방향감이 있는 소리)을 만들어 내는 최초의 end-to-end 프레임워크로, 기존의 \"먼저 모노 소리를 만들고 나중에 공간화하는\" 2단계 방식이 겪던 오차 누적과 시공간 불일치 문제를 해결한다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "TOUCH: Text-guided Controllable Generation of Free-Form Hand-Object Interactions", "arxiv": "2510.14874", "topic": "Hand-Object Interaction", "pub": "2025-10-16", "venue": "프리프린트 (OpenReview 공개, 심사 중)", "authors": "Guangyi Han, Wei Zhai, Yuhang Yang, Yang Cao, Zheng-Jun Zha (University of Science and Technology of China, USTC)", "lead": "기존 손-물체 상호작용(HOI) 생성이 \"안정적으로 쥐기(grasping)\"에만 갇혀 있던 한계를 넘어, 밀기·찌르기·돌리기 같은 자유로운 일상 상호작용을 세밀한 텍스트 지시로 제어해 생성하는 새 과제(Free-Form HOI Generation)와, 이를 위한 인터넷 영상 기반 3D 데이터셋 WildO2, 그리고 접촉(contact)을 명시적으로 모델링하는 3단계 프레임워크 TOUCH를 제안한 연구다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "HORT: Monocular Hand-held Objects Reconstruction with Transformers", "arxiv": "2503.21313", "topic": "Hand-Object Interaction", "pub": "2025-03-27", "venue": "ICCV 2025", "authors": "Zerui Chen, Shizhe Chen, Cordelia Schmid (Inria, École normale supérieure, CNRS, PSL Research University), Rolandos Alexandros Potamias (Imperial College London)", "lead": "한 장의 RGB 이미지만으로 손에 쥔 물체의 3D 점군(point cloud, 물체 표면을 점들의 집합으로 나타낸 것)을 트랜스포머로 빠르고 정확하게 복원하는 방법으로, 성긴 점군에서 조밀한 점군으로 단계적으로 다듬는(coarse-to-fine) 전략과 손 기하 정보를 함께 활용해 기존 최고 성능(SOTA)을 능가하면서도 훨씬 빠른 추론 속도를 달성한다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "EgoGapBench: Benchmarking Egocentric Action Selection in Multi-Agent Scenes", "arxiv": "2607.00547", "topic": "Egocentric Vision", "pub": "2026-07-01", "venue": "프리프린트 (arXiv cs.CV, Comments 필드 확인 불가)", "authors": "Jihyeok Jung (KAIST AI), Jeewu Lee (Sogang University), Sanghyeop Kim (Sogang University), Chanhee Han (과학기술정보통신부), Seong Joon Oh (KAIST AI, 교신저자)", "lead": "1인칭 신체 단서를 없앤 다중 에이전트 장면에서 \"지금 내 시점에서 할 수 있는 행동\"을 고르게 하는 진단용 벤치마크를 만들어, 현재 MLLM이 사람과 크게 벌어질 뿐 아니라 남이 하고 있는 행동을 그대로 따라 고르는 구조적 실패를 보인다는 것을 밝힌 연구.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "EgoSAT: A Comprehensive Benchmark of Egocentric Streaming Interaction Understanding", "arxiv": "2606.24422", "topic": "Egocentric Streaming", "pub": "2026-06-23", "venue": "프리프린트 (cs.CV, v1 2026년 6월 23일 제출)", "authors": "Yijia Lei, Jinzhao Li(프로젝트 리드), Yichi Zhang, Jiacheng Hua, Yin Li, Miao Liu(교신) — 칭화대 College of AI, University of Wisconsin–Madison", "lead": "1인칭 영상이 실시간으로 흘러들어오는 상황에서 과거·현재·미래에 대한 질문을 하나의 스트리밍 틀로 묶어 평가하고, 정확도뿐 아니라 \"지금 이 질문에 답할 수 있는 상태인가(answerability)\"를 모델이 스스로 아는지까지 진단하는 첫 종합 벤치마크다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "What Should a Streaming Video Model Remember?", "arxiv": "2606.16353", "topic": "Egocentric Streaming", "pub": "2026-06-15", "venue": "프리프린트", "authors": "Haonan Ge, Yiwei Wang, Hang Wu, Yujun Cai (University of California, Santa Barbara / University of California, Merced / The University of Queensland)", "lead": "끊기지 않고 들어오는 영상 스트림에서 \"기억을 더 많이 쌓는 것\"이 아니라 \"정해진 예산 안에서 무엇을 어떻게 배분할 것인가\"로 문제를 다시 정의하고, 언제 쓸지·무엇을 남길지·어떻게 꺼낼지를 세 모듈로 나눠 처리하는 SelectStream을 제안해 StreamingBench 82.67%, OVO-Bench 67.03%를 달성한 연구다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Spatio-Temporal Audio Language Modeling for Dynamic Sound Sources", "arxiv": "2606.14141", "topic": "Spatial Audio", "pub": "2026-06-12", "venue": "프리프린트 (ACL 계열 양식, Limitations·Ethical Considerations 섹션 포함)", "authors": "Oh Hyun-Bin(POSTECH), Kazuki Shimada(Sony AI), Yuhta Takida(Sony AI), Kim Sung-Bin(POSTECH), Toshimitsu Uesaka(Sony AI), Takashi Shibuya(Sony AI), Kyeongyoon Lee(성균관대), Tae-Hyun Oh(KAIST, 교신), Yuki Mitsufuji(Sony AI / Sony Group, 교신)", "lead": "소리를 \"무슨 소리인가\"로만 보지 않고 시간에 따라 방향·거리가 변하는 **궤적을 가진 개체**로 다루기 위해, 움직이는 음원까지 포함한 앰비소닉 QA 벤치마크(ST-AudioQA), 시간 해상도를 가진 공간 오디오 인코더(ST-Audio Encoder), 그리고 이를 LLM에 붙인 ST-AudioLM을 함께 제안한 논문이다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "LUCID: Learning Embodiment-Agnostic Intent Models from Unstructured Human Videos for Scalable Dexterous Robot Skill Acquisition", "arxiv": "2606.11628", "topic": "Human-to-Robot Learning", "pub": "2026-06-10", "venue": "프리프린트", "authors": "Harsh Gupta (University of Illinois Urbana-Champaign), Guanya Shi (Carnegie Mellon University), Wenzhen Yuan (University of Illinois Urbana-Champaign)", "lead": "로봇 원격조작 데이터를 한 프레임도 쓰지 않고, 인터넷에 널린 사람 조작 영상에서 \"다음 1초 동안 장면이 어떻게 변해야 하는가\"라는 의도(intent)만 배우고, 그 의도를 실제 관절 명령으로 바꾸는 일은 대규모 병렬 시뮬레이션에서 따로 학습한 뒤 둘을 실시간 폐루프로 붙인 프레임워크다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Hand-centric Human-to-Robot Trajectory Transfer from Video Demonstrations via Open-World Contact Localization", "arxiv": "2606.10743", "topic": "Human-to-Robot Learning", "pub": "2026-06-09", "venue": "프리프린트", "authors": "Yitian Shi\\*, Di Wen\\*, Zhengqi Han, Zicheng Guo, Yu Hu, Edgar Welte, Kunyu Peng, Rainer Stiefelhagen, Rania Rayyes (Karlsruhe Institute of Technology, KIT / \\*공동 1저자)", "lead": "사람이 물건을 다루는 스테레오 영상 한 편에서 손 궤적을 복원하고, 물체 이름도 언어 프롬프트도 없이 \"언제 접촉이 시작되고 끝나는지\"를 찾아낸 뒤, 그 접촉 시작 프레임의 사람 파지 의도를 평행 그리퍼(parallel-jaw) 그랩으로 옮겨 실행 가능한 로봇 궤적 여러 개를 뽑아내는 프레임워크 HOWTransfer를 제안한다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Exploring Audio Hallucination in Egocentric Video Understanding", "arxiv": "2604.23860", "topic": "Egocentric Audio-Visual", "pub": "2026-04-26", "venue": "프리프린트 (arXiv cs.CV, v1 기준 / 4쪽 구성과 ABSTRACT 표기로 보아 음성·신호처리 학회 투고본 형식이나 Comments에 발표처 명시 없음)", "authors": "Ashish Seth (Meta / University of Maryland, College Park), Xinhao Mei, Changsheng Zhao, Varun Nagaraja, Ernie Chang, Gregory P. Meyer, Gael Le Lan, Yunyang Xiong, Vikas Chandra, Yangyang Shi, Zhipeng Cai (Meta), Dinesh Manocha (University of Maryland, College Park)", "lead": "1인칭(에고센트릭) 영상에서 오디오-비주얼 언어 모델이 \"화면에 보이니까 들렸을 것\"이라며 실제로 나지 않은 소리를 지어내는 현상(audio hallucination, 오디오 환각)을 처음으로 체계적으로 측정한 벤치마크로, Ego4D 300클립·1,000개 소리 질문을 만들어 최신 모델조차 환각 질문에서 27~40% 정확도에 그친다는 사실을 드러낸 논문.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Do MLLMs Understand Pointing? Benchmarking and Enhancing Referential Reasoning in Egocentric Vision", "arxiv": "2604.21461", "topic": "Egocentric Vision", "pub": "2026-04-23", "venue": "프리프린트", "authors": "Chentao Li, Zirui Gao, Mingze Gao, Yinglian Ren, Jianjiang Feng(교신), Jie Zhou — 칭화대 자동화과 / 칭화대 미술디자인대", "lead": "1인칭 시점에서 사용자가 손가락으로 가리키는 대상을 MLLM이 제대로 짚어내는지 측정하는 벤치마크 EgoPoint-Bench(총 11.7k QA)를 만들고, 최신 모델들이 손가락 방향 대신 \"손 근처에 있는 물체\"나 \"눈에 띄는 물체\"를 고르는 지시 환각(Referential Hallucination)에 빠진다는 사실을 밝힌 뒤, 시뮬레이션 데이터 LoRA 파인튜닝으로 실환경까지 전이되는 성능 향상을 보인 연구다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "ForeHOI: Feed-forward 3D Object Reconstruction from Daily Hand-Object Interaction Videos", "arxiv": "2602.06226", "topic": "Hand-Object Interaction", "pub": "2026-02-05", "venue": "프리프린트 (arXiv, cs.CV)", "authors": "Yuantao Chen, Jiahao Chang, Chongjie Ye, Chaoran Zhang, Zhaojie Fang, Chenghong Li, Xiaoguang Han — SSE, CUHK-Shenzhen / FNii-Shenzhen / SDS, CUHK-Shenzhen", "lead": "손에 가려진 물체를 담은 일상 단안(monocular) 영상에서, 전처리 없이 1분 안에 물체의 완전한 3D 형상을 한 번에 뽑아내는 최초의 feed-forward 모델. 2D 마스크 채우기(inpainting)와 3D 형상 완성(shape completion)을 한 네트워크 안에서 동시에 풀어 가림(occlusion) 문제를 해결한다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "EgoAVU: Egocentric Audio-Visual Understanding", "arxiv": "2602.06139", "topic": "Egocentric Audio-Visual", "pub": "2026-02-05", "venue": "프리프린트", "authors": "Ashish Seth, Xinhao Mei, Changsheng Zhao, Varun Nagaraja, Ernie Chang, Gregory P. Meyer, Gael Le Lan, Yunyang Xiong, Vikas Chandra, Yangyang Shi, Dinesh Manocha, Zhipeng Cai (Meta, University of Maryland, College Park)", "lead": "1인칭(egocentric) 영상에서 소리와 화면을 함께 이해하는 학습 데이터가 없다는 문제를, 오픈소스 모델만으로 돌아가는 자동 데이터 생성 엔진 EgoAVU로 풀어낸 연구다. Ego4D 영상에서 300만 건 규모의 오디오-비주얼 질의응답(EgoAVU-Instruct)과 사람이 검수한 3천 건 벤치마크(EgoAVU-Bench)를 만들었고, 이 벤치마크가 현재 멀티모달 대형 언어 모델(MLLM)이 소리를 무시하고 화면에만 쏠려 있다는 사실을 드러낸다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "EgoSafetyBench: A Diagnostic Egocentric Video Benchmark for Evaluating Embodied VLMs as Runtime Safety Guards", "arxiv": "2607.00218", "topic": "Egocentric Vision", "pub": "2026-06-30", "venue": "프리프린트 (cs.CV, v1 2026년 6월 30일 제출)", "authors": "Siddhant Panpatil, Arth Singh (공동 1저자), Mijin Koo, Chaeyun Kim, Haon Park, Dasol Choi (교신) — AIM Intelligence, 서울대학교", "lead": "로봇 시점(1인칭) 영상 1,200개를 0.5초 단위로 라벨링해, 비전-언어 모델(VLM)이 실시간 안전 감시자(runtime safety guard) 역할을 할 때 위험을 \"언제\" 놓치는지와 장면 속 거짓 표지판에 얼마나 속는지를 갈라서 진단하는 벤치마크다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "EgoIntrospect: An Egocentric Dataset and Benchmark for User-Centric Internal State Reasoning", "arxiv": "2605.17262", "topic": "Egocentric Vision", "pub": "2026-05-17", "venue": "프리프린트", "authors": "Zeyu Wang, Chang Liu, Eduardus Tjitrahardja, Yuntao Wang, Borislav Pavlov, Fangfei Gou, Jose Manuel Davila, Dai Shi, Ran Xu, Yue Pan, Jiayi Tan, Shuting Chang, Qi Wang, Jinzhao Li, Jiacheng Hua, Yifei Huang, Jingwei Sun, Yu Zhang, Liuxin Zhang, Guocai Yao, Jia Jia, Yin Li, Qianying Wang, Yuanchun Shi, Miao Liu (Tsinghua University, Tongji University, Renmin University of China, The University of Tokyo, Lenovo Group, Peking University, University of Wisconsin–Madison, Shanghai Qi Zhi Institute)", "lead": "스마트 안경·스마트 워치·반지·손목밴드를 한꺼번에 착용한 60명이 각자의 일상을 180시간 촬영한 뒤 착용자 본인이 직접 자기 감정·요청 의도·기억 필요성을 라벨링한 최초의 1인칭(egocentric) 데이터셋을 만들고, 이 라벨로 멀티모달 대형 언어 모델(MLLM)이 사용자의 내적 상태(internal state)를 읽어낼 수 있는지 평가한 연구다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "Grasp in Gaussians: Fast Monocular Reconstruction of Dynamic Hand-Object Interactions", "arxiv": "2604.12929", "topic": "Hand-Object Interaction", "pub": "2026-04-14", "venue": "프리프린트", "authors": "Ayce Idil Aytekin, Xu Chen, Zhengyang Shen, Thabo Beeler, Helge Rhodin, Rishabh Dabral, Christian Theobalt (Max Planck Institute for Informatics / Saarbrücken Research Center for Visual Computing, Interaction and AI / Google / Bielefeld University)", "lead": "카메라 한 대로 찍은 영상에서 손과 물체의 3D 모양·움직임을 복원하되, 무거운 신경망 표현을 매 프레임 최적화하는 대신 생성형 3D 모델로 물체를 한 번만 만들어 두고 고전 기법인 Sum-of-Gaussians(가우시안 합) 추적으로 가볍게 따라가서, 기존 방법보다 6.4배 빠르면서 정확도까지 높인 방법이다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "FoleyDesigner: Immersive Stereo Foley Generation with Precise Spatio-Temporal Alignment for Film Clips", "arxiv": "2604.05731", "topic": "Spatial Audio", "pub": "2026-04-07", "venue": "프리프린트 (arXiv cs.CV, Comments 필드에 발표처 명시 없음)", "authors": "Mengtian Li, Kunyan Dai, Yi Ding, Ruobing Ni, Ying Zhang (Shanghai Film Academy, Shanghai University / Shanghai Engineering Research Center of Motion Picture Special Effects), Wenwu Wang (University of Surrey, UK), Zhifeng Xie (Shanghai University) — Wang, Xie가 교신저자", "lead": "무성 영화 클립을 입력받아, 인간 폴리 아티스트의 작업 순서(장면 분해 → 음향 제작 → 믹싱)를 그대로 모듈로 옮긴 뒤 영상에서 뽑은 깊이·방위각 궤적으로 diffusion을 조건화해, 화면 속 움직임과 프레임 단위로 맞물리는 스테레오 Foley를 만들고 5.1 서라운드까지 내보내는 프레임워크.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "AGILE: Hand-Object Interaction Reconstruction from Video via Agentic Generation", "arxiv": "2602.04672", "topic": "Hand-Object Interaction", "pub": "2026-02-04", "venue": "SIGGRAPH 2026 (Conference Papers)", "authors": "Jin-Chuan Shi, Binhong Ye, Tao Liu, Xiaoyang Liu, Yangjinhui Xu, Junzhe He, Zeju Li, Hao Chen, Chunhua Shen (State Key Lab of CAD & CG, Zhejiang University / Zhejiang University of Technology)", "lead": "단안(monocular) 영상에서 손-물체 상호작용을 복원할 때, 가려진 부분을 \"재구성\"으로 메우는 대신 VLM이 감독하는 생성(agentic generation)으로 완결된 물체 메시를 먼저 만들고, 접촉이 시작되는 한 프레임만 앵커로 잡아 추적하는 방식으로 SfM 의존성을 없앤 프레임워크다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "Residual Learning for Neural Ambisonics Encoders", "arxiv": "2601.18322", "topic": "Spatial Audio", "pub": "2026-01-26", "venue": "프리프린트 (Comments 필드 없음)", "authors": "Thomas Deppisch, Yang Gao, Manan Mittal, Benjamin Stahl, Christoph Hold, David Alon, Zamir Ben-Hur — 전원 Reality Labs Research, Meta (Deppisch는 Chalmers University of Technology, Mittal은 Stony Brook University 공동 소속)", "lead": "스마트글래스의 5채널 마이크 배열 신호를 Ambisonics로 변환할 때, 신경망이 선형 인코더를 대체하는 대신 그 출력에 더할 **보정항(residual)** 만 학습하도록 바꾸면 모든 지표에서 안정적으로 이득이 난다는 것을 실측 array transfer function 기반으로 보인 논문이다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "Improving and Evaluating Hand-Object Interaction Detection", "arxiv": "2606.17384", "topic": "Hand-Object Interaction", "pub": "2026-06-16", "venue": "프리프린트", "authors": "Ahmad Darkhalil (University of Bristol), Dima Damen (University of Bristol), David Fouhey (New York University)", "lead": "Transformer 기반 HOI-DETR 하나로 손, 손이 직접 잡은 물체(1st object), 도구를 거쳐 조작되는 물체(2nd object)와 이들 사이의 상호작용 관계까지 한꺼번에 검출하고, 여기에 정제한 데이터셋과 프레임/비디오 단위 평가 프로토콜을 함께 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "EgoPhys: Learning Generalizable Physics Models of Deformable Objects from Egocentric Video", "arxiv": "2606.16202", "topic": "Egocentric Vision", "pub": "2026-06-15", "venue": "프리프린트", "authors": "Hyunjin Kim, Ri-Zhao Qiu, Guangqi Jiang, Xiaolong Wang (UC San Diego)", "lead": "사람이 물체를 직접 만지며 촬영한 1인칭(egocentric) RGB 영상 한 편만으로 변형 물체(deformable object, 형태가 바뀌는 물체)의 물리적 디지털 트윈(physical digital twin, 실제 물체의 물리 거동을 그대로 재현하는 가상 모델)을 만들고, 코드북(codebook) 기반 물리 프라이어를 통해 처음 보는 물체에도 스프링별 재최적화 없이 곧바로 적용되는 물리 모델을 학습하는 프레임워크다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Probing Spatial Structure in Pretrained Audio Representations", "arxiv": "2606.05544", "topic": "Spatial Audio", "pub": "2026-06-04", "venue": "Interspeech 2026", "authors": "Chuyang Chen, Sivan Ding, Adrian S. Roman, Juan Pablo Bello (Music and Audio Research Laboratory, New York University, USA) — Chen, Ding, Roman은 공동 1저자", "lead": "사전학습된 오디오 모델의 frozen embedding에 공간(spatial) 정보가 얼마나 담겨 있는지를, 가벼운 linear probing(표현 안에 어떤 정보가 들어 있는지 진단하는 방법)으로 요인별로 나눠 측정하는 SARL(Spatial Audio Representation Learning) 벤치마크를 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "CHOIR: Contact-aware 4D Hand-Object Interaction Reconstruction", "arxiv": "2605.20992", "topic": "Hand-Object Interaction", "pub": "2026-05-20", "venue": "프리프린트", "authors": "Hao Xu (The Chinese University of Hong Kong), Yilin Liu (University College London), Yinqiao Wang (The Chinese University of Hong Kong), Chi-Wing Fu (The Chinese University of Hong Kong), Niloy J. Mitra (University College London, Adobe Research)", "lead": "한 대의 카메라로 찍은 단안(monocular) RGB 영상만으로 손의 관절 움직임, 물체의 형상과 6D 포즈 궤적, 접촉(손이 물체에 닿는 지점)을 한꺼번에 복원한다. 이때 접촉을 손과 물체를 잇는 명시적 신호로 삼아 둘의 정렬과 물리적 자연스러움을 끌어올리는 open-world 4D Hand-Object Interaction 복원 프레임워크다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Towards Streaming Synchronized Spatial Audio Generation via Autoregressive Diffusion Transformer", "arxiv": "2605.30940", "topic": "Spatial Audio", "pub": "2026-05", "venue": "프리프린트", "authors": "Ke Lei, Yu Zhang, Changhao Pan, Xueyi Pu, Wenxiang Guo, Ruiqi Li, Zhou Zhao (Zhejiang University 등; 제공된 본문 excerpt에는 개별 소속이 명시적으로 표기되어 있지 않음)", "lead": "360도 파노라마 비디오와 텍스트를 입력받아 4채널 FOA(First-Order Ambisonics, 1차 앰비소닉스) 공간 음향을 낮은 지연으로 스트리밍 생성하는 causal autoregressive diffusion transformer 프레임워크 SwanSphere를 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Ego-1K – A Large-Scale Multiview Video Dataset for Egocentric Vision", "arxiv": "2603.13741", "topic": "Egocentric Vision", "pub": "2026-03-14", "venue": "프리프린트", "authors": "Jae Yong Lee, Daniel Scharstein, Akash Bapat, Hao Hu, Andrew Fu, Haoru Zhao, Paul Sammut, Xiang Li, Stephen Jeapes, Anik Gupta, Lior David, Saketh Madhuvarasu, Jay Girish Joshi, Jason Wither (전원 Meta Reality Labs 소속)", "lead": "사용자가 쓴 VR 헤드셋(카메라 4개)을 동기화된 카메라 12개로 빙 둘러싼 커스텀 rig로 촬영해, 시간이 맞춰진 egocentric(1인칭 시점) multiview 비디오 약 1,000개를 모은 데이터셋이다. neural 3D/4D video synthesis와 동적 장면 이해를 위한 벤치마크로 쓸 수 있다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}];
const COLORS = {"Egocentric Vision": "#0ea5e9", "Spatial Audio": "#6366f1", "Hand-Object Interaction": "#10b981", "Egocentric Streaming": "#64748b", "Human-to-Robot Learning": "#64748b", "Egocentric Audio-Visual": "#64748b"};
let activeTopic = "ALL";
let sortKey = "week", sortDir = -1;

function esc(s) { return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildChips() {
  const box = document.getElementById("chips");
  const topics = ["ALL", ...Object.keys(COLORS)];
  box.innerHTML = topics.map(t => {
    const c = t === "ALL" ? "#334155" : COLORS[t];
    const style = t === activeTopic ? `background:${c}` : "";
    const cls = t === activeTopic ? "chip active" : "chip";
    return `<span class="${cls}" style="${style}" onclick="setTopic('${t.replace(/'/g,"\\'")}')">${t==="ALL"?"전체":esc(t)}</span>`;
  }).join("");
}
function setTopic(t) { activeTopic = t; buildChips(); render(); }
function sortBy(k) { if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==="week"||k==="pub")?-1:1; } render(); }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let list = PAPERS.filter(p => activeTopic==="ALL" || p.topic===activeTopic);
  if (q) list = list.filter(p => (p.title+" "+p.authors+" "+p.arxiv+" "+p.venue+" "+p.lead).toLowerCase().includes(q));
  list.sort((a,b) => { const x=(a[sortKey]||""), y=(b[sortKey]||""); return x<y?-sortDir:x>y?sortDir:0; });
  const rows = document.getElementById("rows");
  rows.innerHTML = list.map(p => {
    const c = COLORS[p.topic] || "#64748b";
    const links = [];
    if (p.arxiv) {
      links.push(`<a href="https://arxiv.org/abs/${p.arxiv}" target="_blank">arXiv</a>`);
      links.push(`<a href="https://arxiv.org/pdf/${p.arxiv}" target="_blank">PDF</a>`);
    }
    if (p.report) links.push(`<a href="${esc(p.report)}#${""}" target="_blank">리포트</a>`);
    return `<tr>
      <td class="date">${esc(p.week)}</td>
      <td><span class="tp" style="background:${c}">${esc(p.topic)}</span></td>
      <td class="ttl">${esc(p.title)}${p.lead?`<span class="lead">${esc(p.lead)}</span>`:""}</td>
      <td class="date">${esc(p.pub)}</td>
      <td>${esc(p.venue)}</td>
      <td class="lk">${links.join("")}</td>
    </tr>`;
  }).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("count").textContent = `${list.length}편 / 전체 ${PAPERS.length}편`;
}
buildChips(); render();
</script>
