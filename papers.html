<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#6366f1; }

    :root { --bg:#0b1120; --card:#131b2e; --ink:#e8edf6; --muted:#94a3b8; --line:#243049; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  header.top { background:linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:34px 20px 26px; }

  header.top a.home { color:#cbd5e1; text-decoration:none; font-size:13px; }
  header.top a.home:hover { color:#fff; }
  header.top h1 { margin:8px 0 4px; font-size:24px; }
  header.top p { margin:0; color:#cbd5e1; font-size:13.5px; }
  .wrap { max-width:1040px; margin:0 auto; padding:20px 20px 64px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:6px 0 16px; }
  #q { flex:1; min-width:220px; padding:10px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--ink); font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
    font-size:12.5px; padding:5px 11px; border-radius:20px; user-select:none; }
  .chip.active { color:#fff; border-color:transparent; }
  .count { color:var(--muted); font-size:13px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; font-size:13.5px; }
  thead th { text-align:left; background:#f1f5f9; color:#0f172a; font-weight:700; padding:10px 12px;
    border-bottom:2px solid #cbd5e1; white-space:nowrap; cursor:pointer; }
  @media (prefers-color-scheme: dark) { thead th { background:#1b2740; color:#e8edf6; } }
  tbody td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover { background:rgba(99,102,241,.06); }
  .tp { display:inline-block; color:#fff; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .ttl { font-weight:600; }
  .ttl .lead { display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px; }
  .date { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--muted); }
  .lk a { color:var(--accent); text-decoration:none; font-size:12.5px; margin-right:8px; white-space:nowrap; }
  .lk a:hover { text-decoration:underline; }
  .empty { text-align:center; color:var(--muted); padding:40px; }
  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:28px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>

const PAPERS = [{"title": "Track, Articulate, Act: Generating Articulation from Casual Human Videos", "arxiv": "2609.19119", "topic": "Hand-Object Interaction", "pub": "2026-09-16", "venue": "프리프린트 (Comments: \"Preprint. Under Review\")", "authors": "Jiaming Zhang, Homanga Bharadhwaj (arXiv HTML 판본에 소속 정보가 표기되어 있지 않음)", "lead": "깊이 센서도, 다시점 촬영도, 사전 스캔도, 관절 주석도, 로봇 시연도 없이 **평범한 단안 RGB 인간 영상 하나**로부터 관절 물체(articulated object)의 고정 링크·가동 링크·관절 종류(회전/직선)·관절 궤적을 복원하고, 복원한 3D 손 궤적을 그 물체에 정렬해 MuJoCo에서 **접촉으로 실제로 물체를 움직이게** 재현하는 모듈형 real-to-sim 프레임워크다.", "week": "2026-09-21", "report": "weekly/2026-09-21/2026-09-21_paper_summary.html"}, {"title": "InterMASH: A Unified Geometric Representation for Grasp Synthesis", "arxiv": "2609.18504", "topic": "Hand-Object Interaction", "pub": "2026-09-16", "venue": "SIGGRAPH Asia 2026 Conference Papers (2026년 12월 1–4일, 쿠알라룸푸르)", "authors": "Xuanze Yang, Yumeng Liu(교신저자), Haiyang Xin, Changhao Li, Haowei Shen, Ligang Liu (University of Science and Technology of China) / Kai Xu (Jiangsu Key Laboratory of AI for Industries, Institute of AI for Industries, Chinese Academy of Sciences) / Ruizhen Hu (Shenzhen University)", "lead": "물체를 감싸는 구(sphere) 위에 고정 앵커를 뿌리고, 각 앵커에 저차 구면조화함수(spherical harmonics) 계수로 **손 표면·물체 표면·접촉 정보를 한꺼번에** 담는 InterMASH라는 통합 토큰 표현을 제안하고, 이 토큰 공간에서 직접 동작하는 conditional Diffusion Transformer로 사람 손(MANO)과 여러 로봇 손(ShadowHand, Barrett, Allegro)의 파지(grasp)를 하나의 모델로 생성한다.", "week": "2026-09-21", "report": "weekly/2026-09-21/2026-09-21_paper_summary.html"}, {"title": "EgoPathBench: Evaluating Zero-Shot Egocentric Waypoint Decision-Making in Vision-Language Models", "arxiv": "2609.16610", "topic": "Egocentric Vision", "pub": "2026-09-15", "venue": "프리프린트 (Comments: \"18 pages, including supplementary material\")", "authors": "Yang Zhao, Zhuo Chen, Xubo Yang (Shanghai Jiao Tong University)", "lead": "1인칭 RGB 한 장 위에 번호가 붙은 waypoint(이동 후보 지점)를 겹쳐 놓고, \"목표까지 갈 수 있는 순서 있는 경로를 고르라\"는 단일 인터페이스로 VLM의 통합적 공간 지능을 재는 벤치마크 EgoPathBench를 제안한다. : "시각 중심으로 굳어진 world model 연구에 **소리를 상태 표현(state representation)으로 끌어들이기 위한 첫 단추**로, 로봇이 환경을 돌아다니며 수집한 binaural(양이) 오디오를 0.2초 단위로 잘라 복원하는 VAE 세 종류(Mel / 4채널 STFT / 복소수 VAE)를 만들고 공개한 오픈소스 파이프라인 기술 보고서다. ---", "week": "2026-09-21", "report": "weekly/2026-09-21/2026-09-21_paper_summary.html"}, {"title": "Single-Query Person-Centric Bimanual Hand-Object Interaction Detection", "arxiv": "2609.12155", "topic": "Hand-Object Interaction", "pub": "2026-09-10", "venue": "ECCV 2026", "authors": "Jonghyun Kim, Junho Roh, Yubin Yoon, Hyotae Lee, Jongkuk Park, Taehwan Hwang, Jaechul Kim, Jungho Lee — LG전자 CTO부문 AI Lab (South Korea)", "lead": "손을 따로따로 검출하던 기존 방식 대신, **사람 한 명 = query 하나**로 묶어 사람 박스·자세·양손 박스·양손 접촉 상태·상호작용 대상까지 한 번에 예측하는 person-centric 프레임워크를 제안하고, 이를 위한 COCO 기반 데이터셋과 tuple 단위 평가 지표를 함께 만든 논문이다.", "week": "2026-09-14", "report": "weekly/2026-09-14/2026-09-14_paper_summary.html"}, {"title": "From Where to How: Continuous 4D Interaction Forecasting from Egocentric Video", "arxiv": "2609.08636", "topic": "Egocentric Vision", "pub": "2026-09-08", "venue": "프리프린트 (abs 페이지에 Comments/발표처 언급 없음)", "authors": "Qiaohui Chu, Haoyu Zhang, Meng Liu, Haoxiang Shi, Dongmei Jiang, Liqiang Nie (arXiv HTML 판본에 소속 정보가 표기되어 있지 않음)", "lead": "1인칭 영상에서 \"앞으로 손이 어디를 만질지(where)\"를 연속 3D 좌표열로 먼저 예측하고, 그 좌표열을 기하학적 조건으로 삼아 \"몸이 어떻게 움직여 그것을 실현할지(how)\"를 이어서 예측하는 2단계 프레임워크 HIGFlow와, 두 목표가 시간·좌표계상 정렬된 23만 샘플 규모 데이터셋 Coherent4D를 제안한다.", "week": "2026-09-14", "report": "weekly/2026-09-14/2026-09-14_paper_summary.html"}, {"title": "Dex-X: Learning Visual-Tactile Dexterous Manipulation From Human Videos with Simulated Interaction", "arxiv": "2609.07747", "topic": "Hand-Object Interaction", "pub": "2026-09-07", "venue": "프리프린트 (프로젝트 웹사이트만 명시, 발표처 언급 없음)", "authors": "Ruoqu Chen, Feixiang Ruan, Liu Cao, Zihao Wang, Botian Xu, Shiqin Tong, Jiajun Liu, Mingzhi Pei, Chenyu Zhang, Wanli Xing, Kaifeng Zhang, Mengdi Xu — Tsinghua University, Shanghai Qizhi Institute, Sharpa, Tongji University, Renmin University", "lead": "단안(monocular) 사람 영상에는 없는 촉각 정보를 시뮬레이션의 접촉 물리로 \"채워 넣어\", 로봇으로 데이터를 따로 모으지 않고도 실제 로봇에 바로 올라가는 visual-tactile dexterous manipulation 정책을 학습하는 프레임워크.", "week": "2026-09-14", "report": "weekly/2026-09-14/2026-09-14_paper_summary.html"}, {"title": "One-Stage Multi-Task Instruction-Guided 3D Spatial Audio Editing", "arxiv": "2609.04975", "topic": "Spatial Audio", "pub": "2026-09-04", "venue": "프리프린트", "authors": "Ke Lei, Chenyuhao Wen, Yu Zhang, Wenxiang Guo, Changhao Pan, Sashuai Zhou, Yongshi Li, Ruiqi Li, Ruofan Hu, Haorui Xu, Xiang Yin, Zhou Zhao (Zhejiang University, ByteDance)", "lead": "\"앞쪽에 있던 군중을 오른쪽으로 옮기고 왼쪽에 기타 스트럼을 하나 넣어줘\" 같은 복합 자연어 지시를 받아, 기존 FOA 3차원 음장을 중간 단계 없이 **한 번의 생성으로** 편집하는 최초의 멀티태스크 프레임워크 SwanWeave를 제안한다. ---", "week": "2026-09-14", "report": "weekly/2026-09-14/2026-09-14_paper_summary.html"}, {"title": "PhysWave: Physics-Guided Latent Diffusion Models for Controllable Spatial Audio Generation", "arxiv": "2608.29549", "topic": "Spatial Audio", "pub": "2026-08-30", "venue": "EMNLP 2026 Main Conference", "authors": "Lingfeng Yao, Chenpei Huang, Xingke Yang, Ziye Geng, Changqing Luo, Miao Pan (University of Houston), Hao Wang (Stevens Institute of Technology), Jiang Liu (Waseda University)", "lead": "텍스트로 3차원 공간 음향(FOA)을 만들 때, 소리의 방향과 거리가 지켜야 할 물리 법칙을 미분 가능한 손실 함수로 직접 학습에 집어넣고, 자연어와 좌표 궤적을 하나의 \"웨이포인트-캡션\" 표현으로 통합한 latent diffusion 모델이다.", "week": "2026-09-14", "report": "weekly/2026-09-14/2026-09-14_paper_summary.html"}, {"title": "VidParse: Online Parsing of Egocentric Procedures Like a Pro", "arxiv": "2608.27562", "topic": "Egocentric Vision", "pub": "2026-08-27", "venue": "ECCV 2026", "authors": "Anubhav Gupta, Archit Kambhamettu, Vatsal Agarwal, Pulkit Kumar, Abhinav Shrivastava (University of Maryland, College Park)", "lead": "1인칭 영상을 실시간으로 \"지금 몇 번째 조리 단계인가\"로 쪼개는 문제를, 학습을 한 번도 하지 않고 frozen foundation model 특징 + 고전 신호처리 경계 검출 + task graph 제약 beam search만으로 푸는 프레임워크다.", "week": "2026-09-14", "report": "weekly/2026-09-14/2026-09-14_paper_summary.html"}, {"title": "MINT: A Unified Model for World-Space Camera and Hand Motion Estimation from Scalable Egocentric Pipeline Supervision", "arxiv": "2609.04958", "topic": "Egocentric Vision", "pub": "2026-09-04", "venue": "프리프린트 (arXiv, cs.CV·cs.RO)", "authors": "Zijie Zhu(ShanghaiTech·Wuji Technology·홍콩대(HKU)), Weiren Cai(Wuji Technology), Yizhou Wang(ShanghaiTech·Wuji Technology), Zhenjie Yang(홍콩대), Yide Liu(Wuji Technology·저장대), Jiahao Chen(Wuji Technology), Guanqi He(칭화대·Wuji Technology, 교신저자)", "lead": "1인칭(egocentric) RGB 영상 한 편을 단일 순전파(single forward pass)로 처리해, 카메라 궤적과 양손(bimanual) 모션을 하나의 세계좌표계(world-space)에서 통째로 복원하는 최초의 통합 파운데이션 모델(foundation model)이다. 여기에 공개 1인칭 영상을 대규모 학습 신호로 바꿔 주는 자동 라벨링 파이프라인(EgoPipeline)을 함께 제안한다. ![MINT 티저: EgoPipeline이 공개 1인칭 영상에 카메라 궤적·양손 MANO를 자동으로 붙여 학습하고, 그 신호만으로 학습한 MINT가 HOT3D·ARCTIC로 제로샷 전이되는 모습](https://arxiv.org/html/2609.04958v1/Teaser.png) - 위쪽: EgoPipeline이 Ego4D·EPIC-KITCHENS·EgoDex에서 모은 공개 1인칭 영상 1,021시간에 카메라 궤적과 양손 MANO 상태를 자동으로 붙여, 각 입력 프레임 위에 복원된 손을 재투영(reproject)해 보여 준다. - 아래쪽: 이 신호만으로 학습한 MINT가 처음 보는 도메인(HOT3D, ARCTIC)으로 제로샷(zero-shot) 전이되는 결과를 보여 준다. - 아키텍처 그림([mint.png](https://arxiv.org/html/2609.04958v1/mint.png)): 32프레임 윈도를 GCT로 인코딩 → 카메라·FoV·양손 MANO·손 관측성 4개 헤드로 분기 - 파이프라인 그림([egopipeline.png](https://arxiv.org/html/2609.04958v1/egopipeline.png)): 손 검출 → GeoCalib·MoGe-2·MegaSaM·HaWoR → 후처리 안정화", "week": "2026-09-07", "report": "weekly/2026-09-07/2026-09-07_paper_summary.html"}, {"title": "Seeing the World and the Self from Egocentric Video (RESELF)", "arxiv": "2609.01276", "topic": "Egocentric Vision", "pub": "2026-09-01", "venue": "프리프린트", "authors": "Kai Guan, Minchao Jiang, Ruichen WangLi, Wentao Zhu(교신), Lei Zhang(교신) — The Hong Kong Polytechnic University / Eastern Institute of Technology, Ningbo", "lead": "1인칭 영상 한 편만으로 주변 3D 장면과 착용자의 전신 동작을 같은 미터 단위 좌표계 안에서 동시에 복원하는 통합 프레임워크 RESELF를 제안한다.", "week": "2026-09-07", "report": "weekly/2026-09-07/2026-09-07_paper_summary.html"}, {"title": "Visually-Guided Spatial Audio Generation for $360^\\circ$ In-the-Wild Speech Scenes", "arxiv": "2608.24579", "topic": "Spatial Audio", "pub": "2026-08-25", "venue": "INTERSPEECH 2026", "authors": "Qingyu Luo, Peng Zhang, Wenwu Wang, Philip J. B. Jackson — 영국 서리대학교(University of Surrey) CVSSP(Centre for Vision, Speech and Signal Processing)", "lead": "360도 영상과 무지향성(omnidirectional) 오디오 한 채널만 주어졌을 때, 영상 속 화자의 위치를 시각적으로 찾아 방향 정보를 담은 1차 앰비소닉스(FOA, First-Order Ambisonics) 음향을 복원하는 \"국소화기-렌더러(Localizer-Renderer)\" 프레임워크와, 이를 위한 실제 유튜브 기반 데이터셋 YT-SPEECH를 제안한 연구다.", "week": "2026-09-07", "report": "weekly/2026-09-07/2026-09-07_paper_summary.html"}, {"title": "DreamHand: Repurposing Video Diffusion Models for Occlusion-Robust Egocentric 3D Hand Motion Recovery", "arxiv": "2608.20308", "topic": "Hand-Object Interaction", "pub": "2026-08-20", "venue": "프리프린트 (arXiv, cs.CV)", "authors": "Yufei Liu, Xixi Wang, Hao Li, Ganlong Zhao, Kaitong Cai, Chengkai Jin, Chunxiao Liu, Jianbo Liu, Siyuan Huang, Xingang Pan, Hongsheng Li — 상하이교통대(SJTU), 난양공대(NTU), 홍콩중문대(CUHK), ACE Robotics", "lead": "1인칭(egocentric) 영상에서 손이 물체에 가려지거나 아예 화면 밖으로 사라지는 상황에서도 두 손의 3D 궤적을 미터 단위로 복원하기 위해, 사전학습된 비디오 확산 모델(video diffusion model, VDM)을 \"생성기\"가 아니라 잡음 없는 단일 순전파로 동작하는 \"결정론적(deterministic) 기하 인코더\"로 재활용한 오프라인 클립 단위 프레임워크 DreamHand를 제안한다.", "week": "2026-09-07", "report": "weekly/2026-09-07/2026-09-07_paper_summary.html"}, {"title": "Geometry-adaptive Ambisonic encoding for sparse microphone arrays of variable topology using physics-informed diffusion", "arxiv": "2608.16240", "topic": "Spatial Audio", "pub": "2026-08-17", "venue": "프리프린트 (eess.AS / cs.SD)", "authors": "Xiang Zhou, Zhengqiao Zhao, Zhengding Luo, Wen Zhang — Northwestern Polytechnical University(西北工业대, 지능음향·몰입형통신 센터, 중국 시안) 및 Nanyang Technological University(난양공과대, DSP Lab, 싱가포르)", "lead": "마이크가 몇 개 안 되고 배치도 제각각인 희소(sparse) 마이크 배열에서 고차 Ambisonics(앰비소닉스, 구면조화 기반 공간음향 표현)를 안정적으로 인코딩하기 위해, 물리 기반 투영 프런트엔드와 조건부 확산 모델(diffusion model)을 결합한 DiffM2A를 제안한 논문이다.", "week": "2026-09-07", "report": "weekly/2026-09-07/2026-09-07_paper_summary.html"}, {"title": "HandEdit: A Unified Benchmark for Egocentric Human-to-Robot Dexterous Hand Image Editing", "arxiv": "2608.12122", "topic": "Hand-Object Interaction", "pub": "2026-08-12", "venue": "프리프린트 (Technical Report, 프로젝트 페이지 https://handedit.github.io/)", "authors": "Zhenjie Yang, Xingyu Jiao, Guopeng Zhong, Shuzhe Yang, Shi Che, Chao Wu, Chenyu Jiang, Dongjie Zhang, Yideng Zhang, Zheng Zhang, Muyun Jiang, Haisheng Su, Shuang Jin, Donghang Zhang, Chao Yang, Li Chen, Hongyang Li, Zuxuan Wu, Yu-Gang Jiang, Xiaosong Jia, Junchi Yan (주로 상하이교통대·푸단대·상하이 AI Lab 계열 저자군)", "lead": "1인칭(egocentric) 시점에서 촬영된 사람 손-팔 조작 영상을, 26종의 로봇 다관절 손/팔(dexterous hand) 형상으로 \"이미지 편집\"해 바꿔주는 대규모 데이터셋과 벤치마크를 구축하고, 상용·오픈소스 이미지 편집 모델 11종을 평가해 현재 모델들이 로봇 형상 충실도(embodiment fidelity)와 손-물체 상호작용 보존에서 크게 부족함을 보인 연구.", "week": "2026-09-07", "report": "weekly/2026-09-07/2026-09-07_paper_summary.html"}, {"title": "GraspHOI: Full-Body 3D Human-Object Reconstruction with Finger-Level Grasps from a Single In-the-Wild Image", "arxiv": "2608.28386", "topic": "Hand-Object Interaction", "pub": "2026-08-28", "venue": "프리프린트 (arXiv v1, cs.CV — Comments 란에 발표처 표기 없음)", "authors": "Semin Kim, Haechan Shin, Jongyoo Kim — Yonsei University ({hohosemin, haechanshin, jy.kim}@yonsei.ac.kr)", "lead": "인터넷에서 주워온 사진 한 장으로 **사람의 전신과 물체를 함께 3D로 복원하되, 손가락 하나하나가 실제로 물체 표면을 쥐고 있도록** 관절 각도까지 최적화하는 첫 번째 프레임워크 GraspHOI를 제안한다. 물체 템플릿이나 카테고리 사전 없이(category-agnostic) 형상을 직접 만들어내고, 사람·손·물체를 따로 복원한 뒤 하나의 미터 단위 카메라 좌표계에 정렬해 접촉을 맞춘다.", "week": "2026-08-31", "report": "weekly/2026-08-31/2026-08-31_paper_summary.html"}, {"title": "C2Dex: Contact-Consistent Reconstruction and Retargeting for Dexterous Manipulation from Monocular Video", "arxiv": "2608.07045", "topic": "Hand-Object Interaction", "pub": "2026-08-07", "venue": "프리프린트 (본문 각주에 \"This work has been submitted to the IEEE for possible publication\" 표기)", "authors": "Jie Ren, Zhehao Jiang, Yinhong Yang, Haorui Jia, Han Jiang (Nanjing University) · Ben Li (China Mobile Research Institute) · Yao Yao, Cheng Lin, Qiu Shen, Zhenshan Bing, Xiao-Xiao Long, Xun Cao (Nanjing University) — 교신저자 Xiao-Xiao Long", "lead": "일반 카메라 한 대로 찍은 사람의 조작 영상에서 **\"물체의 어느 면을 만졌는가\"를 물체 좌표계에 고정된 안정 접촉점으로 뽑아내고**, 이 하나의 표현을 손-물체 복원과 로봇 손 리타게팅 양쪽에 공유시켜, 흔들리지 않고 실제로 실행 가능한 다지 로봇 손(dexterous hand) 궤적을 만들어내는 프레임워크 C2Dex를 제안한다.", "week": "2026-08-31", "report": "weekly/2026-08-31/2026-08-31_paper_summary.html"}, {"title": "EgoHTR: Egocentric 4D Demonstrations of Human Terrain Traversal", "arxiv": "2607.13472", "topic": "Egocentric Vision", "pub": "2026-07-15", "venue": "프리프린트 (Comments에는 프로젝트 페이지 https://egohtr.github.io 만 기재)", "authors": "Alex Brandes, Haig Conti Georges Sajelian, Manthan Patel, Dominik Hollidt, Chenhao Li, Matthias Heyrman, Oliver Hausdörfer, Manuel Kaufmann, Xi Wang, Jonas Frey, Angela P. Schoellig, Christian Holz, Marc Pollefeys, Marco Hutter — ETH Zurich, Stanford, UC Berkeley, TU Munich", "lead": "머리에 쓰는 에고센트릭 안경, IMU 모션캡처 슈트, 휴대용 3D 스캐너를 묶어 잔해더미·좁은 관 같은 진짜 험지에서 사람의 움직임과 주변 지형을 센티미터 정밀도로 함께 복원하고, 그 데이터로 휴머노이드 로봇의 지각 기반 보행 정책까지 학습시킨 데이터셋·파이프라인이다.", "week": "2026-08-31", "report": "weekly/2026-08-31/2026-08-31_paper_summary.html"}, {"title": "UNIEGO: Proxies as Mediators for Unified Egocentric Video Representation Learning", "arxiv": "2606.20559", "topic": "Egocentric Vision", "pub": "2026-06-18", "venue": "프리프린트", "authors": "Wenhao Chi, Arkaprava Sinha, Dominick Reilly, Hieu Le, Srijan Das (University of North Carolina at Charlotte)", "lead": "서로 성격이 완전히 다른 9개의 교사 모델(3인칭 영상, 깊이, 스켈레톤, 파운데이션 모델)을 1인칭 영상 인코더 하나에 밀어 넣을 때 생기는 충돌을, **프록시(proxy)라는 중간 다리 모델**을 한 겹 끼워 넣어 해소하고, 그중 믿을 만한 프록시만 골라 증류하는 2단계 프레임워크 UNIEGO를 제안한다.", "week": "2026-08-31", "report": "weekly/2026-08-31/2026-08-31_paper_summary.html"}, {"title": "FoleySpace: Vision-Aligned Binaural Spatial Audio Generation", "arxiv": "2508.12918", "topic": "Spatial Audio", "pub": "2025-08-18", "venue": "프리프린트 (v2, 2025-08-21 개정)", "authors": "Lei Zhao, Rujin Chen, Xiao-Lei Zhang (Northwestern Polytechnical University · TeleAI, China Telecom), Chi Zhang, Xuelong Li (TeleAI, China Telecom)", "lead": "무음 영상에서 소리가 나는 물체의 위치를 프레임 단위로 추정해 3D 이동 궤적을 만들고, 이를 사전학습된 비디오-투-오디오(V2A) 모델의 모노 오디오와 함께 확산 모델(diffusion model)의 조건으로 넣어, 영상 속 음원 방향과 일치하는 binaural(양이) 공간 음향을 생성하는 프레임워크다.", "week": "2026-08-31", "report": "weekly/2026-08-31/2026-08-31_paper_summary.html"}, {"title": "Ambisonics Super-Resolution Using A Waveform-Domain Neural Network", "arxiv": "2508.00240", "topic": "Spatial Audio", "pub": "2025-08-01", "venue": "프리프린트 (arXiv v1, eess.AS·cs.SD — Comments 란에 발표처 표기 없음)", "authors": "Ismael Nawfal, Symeon Delikaris Manias, Mehrez Souden, Juha Merimaa, Joshua Atkins, Elisabeth McMullin, Shadi Pirhosseinloo, Daniel Phillips — Apple (교신저자 inawfal@apple.com)", "lead": "채널 4개짜리 저해상도 공간음향 포맷인 FOA(1차 앰비소닉스)를 입력받아, 채널 16개짜리 고해상도 포맷인 HOA3(3차 앰비소닉스)로 **파형 영역(waveform-domain)에서 직접 업스케일**하는 데이터 기반 렌더러를 제안한다. 음성 분리용 신경망 Conv-TasNet을 개조해 물리·심리음향 모델에 기대지 않고 종단간(end-to-end)으로 학습했으며, 정량 위치 오차는 실제 HOA3와 평균 0.6 dB 차이, 청취 평가에서는 HOA3와 통계적으로 구별되지 않는 수준의 공간음질을 얻었다.", "week": "2026-08-31", "report": "weekly/2026-08-31/2026-08-31_paper_summary.html"}, {"title": "Ambisonics Encoding of Room Impulse Responses using a Device-Agnostic Diffusion Model", "arxiv": "2608.14097", "topic": "Spatial Audio", "pub": "2026-08-14", "venue": "IWAENC 2026", "authors": "Eloi Moliner¹², Christoph Hold¹, Juan Azcarreta Ortiz¹, Sebastian Prepeliţă¹, Ishwarya Ananthabhotla¹, Daniel Wong¹, Sanjeel Parekh¹, Sanha Lee¹ (¹ Reality Labs Research, Meta / ² Acoustics Lab, DICE, Aalto University, Espoo, Finland)", "lead": "마이크가 적고 배치도 불규칙한 임의의 기기로 측정한 방 임펄스 응답을, HOA(고차 앰비소닉스) RIR의 통계를 학습한 확산 모델을 사전분포로 삼아 최대 12차 앰비소닉스로 복원하는 방법이다.", "week": "2026-08-24", "report": "weekly/2026-08-24/2026-08-24_paper_summary.html"}, {"title": "R4DSG: Relative 4D Scene Graph Memory for Object-Centric Question Answering in Long Egocentric Video", "arxiv": "2608.11017", "topic": "Egocentric Vision", "pub": "2026-08-11", "venue": "ACM Multimedia 2026 (MM '26, 11/10–14, Rio de Janeiro)", "authors": "Ke Ma, Yijie Zhong, Haofen Wang, Meng Wang (Tongji University, College of Design and Innovation) · Yamin Mao, Weiming Li (Samsung R&D Institute China - Beijing) · Hao Chen (Samsung Research America) · Shuai Tan (Shanghai Jiao Tong University)", "lead": "하루치 1인칭(egocentric) 영상을 \"고정된 기준 물체(anchor) 대비 상대적인 물체 위치 변화\"를 원소로 하는 검색용 메모리로 압축해, \"내가 그거 어디 뒀지 / 언제 옮겼지\"류 질문에 답하는 프레임워크다.", "week": "2026-08-24", "report": "weekly/2026-08-24/2026-08-24_paper_summary.html"}, {"title": "MAD-HOI: Masked Autoregressive Diffusion for Generating Articulated Hand Object Interactions from Text", "arxiv": "2608.10162", "topic": "Hand-Object Interaction", "pub": "2026-08-10", "venue": "프리프린트 (Comments: 17 pages, 9 figures, 8 tables — 발표처 명시 없음)", "authors": "Ananya Bal, Kartik Sharma, Ethan Lai, Samyak Tiwari, Liza Dahiya, Chaitanya Chawla, László A. Jeni (Carnegie Mellon University)", "lead": "손·객체 움직임을 이산 토큰이 아닌 **연속 잠재공간**에 물체/왼손/오른손 세 갈래로 분리해 담고, 마스킹 기반 자기회귀 트랜스포머 + 플로우 매칭 헤드로 생성함으로써 접촉 디테일을 지키면서도 가변 길이·합성 동작·완성/중간채움·자동 종료까지 **단일 학습 목표 하나로** 해내는 텍스트-투-HOI 생성 모델이다.", "week": "2026-08-24", "report": "weekly/2026-08-24/2026-08-24_paper_summary.html"}, {"title": "AdaDexGrasp: Adaptive Dexterous Grasping via 3D Visuo-Tactile Representation Fusion", "arxiv": "2608.07600", "topic": "Hand-Object Interaction", "pub": "2026-08-06", "venue": "ECCV 2026 (Accepted)", "authors": "Xirui Liang, Jiaqi Liang\\*, Jingkai Xu\\*, Yuran Wang\\* (Peking University), Ruochong Li (HKUST), Yuanpei Chen (Peking University), Masayoshi Tomizuka, Wei Zhan, Ruihai Wu† (UC Berkeley) — \\*공동 1저자, †교신저자", "lead": "손가락·손바닥 ID를 촉각 신호에 묶어 물체 point cloud에 직접 새겨 넣는 visuo-tactile 표현을 만들고, 이를 써서 초기 grasp 생성 → 성공 여부 판정 → 실패 시 자세 보정까지 한 루프로 돌리는 dexterous grasping 프레임워크다.", "week": "2026-08-24", "report": "weekly/2026-08-24/2026-08-24_paper_summary.html"}, {"title": "Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data", "arxiv": "2608.02580", "topic": "Egocentric Vision", "pub": "2026-08-03", "venue": "프리프린트 (arXiv, cs.RO / Comments 필드 없음)", "authors": "Ye Wang, Pei Lin, Xiong-Hui Chen, Haoqi Yuan, Zhixuan Liang, Yiyang Huang, Anzhe Chen, Zixing Lei, Jie Zhang, Tao Zhang, Haoyang Li, Tong Zhang, Chenxi Xiao, Ziyuan Jiao, Qin Jin — AIM3 Lab (Renmin University of China), Qwen Team (Alibaba Inc.), ShanghaiTech University, BIGAI, Beihang University", "lead": "1인칭(egocentric) 손 조작 영상을 로봇 팔 영상+행동 데이터로 바꿔주는 파이프라인을 대규모로 돌려 15종 로봇 형태에 걸친 18,561시간짜리 합성 데이터셋을 만들고, 이를 실제 로봇 데이터와 섞어 사전학습하면 VLA 정책의 분포 밖(OOD) 일반화가 좋아진다는 것을 처음으로 규모 있게 검증한 연구다.", "week": "2026-08-24", "report": "weekly/2026-08-24/2026-08-24_paper_summary.html"}, {"title": "SonoWorld: From One Image to a 3D Audio-Visual Scene", "arxiv": "2603.28757", "topic": "Spatial Audio", "pub": "2026-03-30", "venue": "CVPR 2026", "authors": "Derong Jin*, Xiyi Chen*, Ming C. Lin, Ruohan Gao (University of Maryland, College Park) / *공동 1저자", "lead": "사진 한 장에서 걸어 다닐 수 있는 3D 장면과, 그 장면의 기하·의미에 맞춰 정렬된 공간 음향(ambisonics)을 함께 만들어내는 최초의 학습 없는(training-free) 파이프라인이다.", "week": "2026-08-24", "report": "weekly/2026-08-24/2026-08-24_paper_summary.html"}, {"title": "BiTSE: Binaural Target Speaker Extraction in Noisy Multi-Talker Environments for AR Glass Arrays", "arxiv": "2608.10106", "topic": "Spatial Audio", "pub": "2026-08-10", "venue": "APSIPA ASC 2026 (accepted, preprint 버전)", "authors": "Selani A. Indrapala, Wageesha N. Manamperi (University of Moratuwa, Sri Lanka — Dept. of Electronic and Telecommunication Engineering)", "lead": "AR 안경에 달린 마이크 어레이로 잡은 시끄러운 다중 화자 상황에서, 목표 화자의 **방향(DoA)**과 **말하는 구간(voice activity)** 두 단서를 함께 써서 그 사람 목소리만 양이(binaural) 신호로 뽑아내는 프레임워크를 제안한다.", "week": "2026-08-17", "report": "weekly/2026-08-17/2026-08-17_paper_summary.html"}, {"title": "MANGO-Grasp: Mahalanobis Fields over Geometry-Oriented 3D Gaussians for Cross-Embodiment Dexterous Grasping", "arxiv": "2608.02014", "topic": "Hand-Object Interaction", "pub": "2026-08-03", "venue": "프리프린트 (IEEE 투고 중)", "authors": "Heng Zhang (A*STAR I2R, NTU), Kevin Yuchen Ma (A*STAR I2R, NUS Show Lab), Mike Zheng Shou (NUS Show Lab), Weisi Lin (NTU), Yan Wu (A*STAR I2R) — Weisi Lin, Yan Wu 교신저자", "lead": "물체를 표면에 붙은 납작한 3D Gaussian 판(plate)들로, 손을 형태·운동 정보를 함께 담은 키포인트 기술자로 표현한 뒤, 둘 사이의 **마할라노비스 거리장(Mahalanobis field)** 을 예측해 여러 종류의 다지 로봇 손에 공통으로 쓰이는 파지(grasp)를 합성하는 프레임워크다.", "week": "2026-08-17", "report": "weekly/2026-08-17/2026-08-17_paper_summary.html"}, {"title": "ReViV: Reconstructing the Viewer and the View in 4D from Monocular Egocentric Video", "arxiv": "2607.17790", "topic": "Egocentric Vision", "pub": "2026-07-20", "venue": "ECCV 2026", "authors": "Xiaozhong Lyu*, Gen Li*, Zhiyin Qian, Xucong Zhang, Marc Pollefeys, Siyu Tang (*공동 1저자) — ETH Zurich / Delft University of Technology / Microsoft", "lead": "1인칭 RGB 영상 한 개만 넣으면 착용자의 몸·손·시선(viewer)과 주변 장면의 카메라 궤적·깊이(view)를 하나의 feed-forward 모델이 동시에 복원하는, 최초의 통합 egocentric 4D 재구성 프레임워크다.", "week": "2026-08-17", "report": "weekly/2026-08-17/2026-08-17_paper_summary.html"}, {"title": "WHOLE: World-Grounded Hand-Object Lifted from Egocentric Videos", "arxiv": "2602.22209", "topic": "Hand-Object Interaction", "pub": "2026-02-25", "venue": "프리프린트 (arXiv Comments에 발표처 명시 없음, 프로젝트 페이지만 기재)", "authors": "Yufei Ye(Stanford University), Jiaman Li(Amazon FAR: Frontier AI & Robotics), Ryan Rong(Stanford University), C. Karen Liu(Stanford University / Amazon FAR)", "lead": "손과 물체의 움직임을 따로 풀지 않고 하나의 생성 사전확률(generative prior)로 함께 모델링해, 1인칭 영상에서 두 손과 물체의 6D 궤적을 세계 좌표계(world frame)에 통째로 복원하는 방법.", "week": "2026-08-17", "report": "weekly/2026-08-17/2026-08-17_paper_summary.html"}, {"title": "LuSeeL: Language-queried Binaural Universal Sound Event Extraction and Localization", "arxiv": "2601.19153", "topic": "Spatial Audio", "pub": "2026-01-27", "venue": "ICASSP 2026", "authors": "Zexu Pan, Shengkui Zhao, Yukun Ma, Haoxu Wang, Yiheng Jiang, Biao Tian, Bin Ma (Tongyi Lab, Alibaba Group, Singapore)", "lead": "\"자동차 경적 소리\"처럼 자유로운 텍스트로 원하는 소리를 지목하면, 양이(binaural) 녹음에서 그 소리만 뽑아내는 동시에 어느 방향에서 났는지까지 한 모델로 함께 예측한다.", "week": "2026-08-17", "report": "weekly/2026-08-17/2026-08-17_paper_summary.html"}, {"title": "egoEMOTION: Egocentric Vision and Physiological Signals for Emotion and Personality Recognition in Real-World Tasks", "arxiv": "2510.22129", "topic": "Egocentric Vision", "pub": "2025-10-25", "venue": "NeurIPS 2025", "authors": "Matthias Jammot, Björn Braun, Paul Streli, Rafael Wampfler, Christian Holz (ETH Zurich 컴퓨터과학과, 스위스)", "lead": "Meta의 Project Aria 스마트 안경으로 1인칭 시선 영상과 생체 신호를 함께 기록하고, 참가자가 스스로 매긴 감정·성격 라벨을 붙인 첫 데이터셋(egoEMOTION)을 공개하면서, 놀랍게도 안경의 시선(eye-tracking) 신호가 심전도·피부전도 같은 전통적 생체 신호보다 실제 상황에서 감정을 더 잘 맞힌다는 것을 보인 연구다.", "week": "2026-08-17", "report": "weekly/2026-08-17/2026-08-17_paper_summary.html"}, {"title": "Towards in-the-wild Egocentric 3D Hand-Object Pose Estimation", "arxiv": "2606.30598", "topic": "Hand-Object Interaction", "pub": "2026-06-29", "venue": "ECCV 2026", "authors": "Siddhant Bansal, Zhifan Zhu, Jiahe Zhao, Dima Damen (University of Bristol); Shashank Tripathi, Michael J. Black (Max Planck Institute for Intelligent Systems, Tübingen)", "lead": "실험실 밖 자연스러운 1인칭(egocentric) 영상에서 두 손과 물체의 3D 자세를 한 번의 forward pass로 추정하기 위해, 손-물체 접촉(contact)에 기반한 대규모 실환경 데이터셋 **EPIC-Contact**와 손 사전정보(hand prior)로 물체 특징을 조건화하는 트랜스포머 **HOPformer**를 제안한다.", "week": "2026-08-10", "report": "weekly/2026-08-10/2026-08-10_paper_summary.html"}, {"title": "EgoTraj: Real-World Egocentric Human Trajectory Dataset for Multimodal Prediction", "arxiv": "2605.19004", "topic": "Egocentric Vision", "pub": "2026-05-18", "venue": "프리프린트", "authors": "Ahmad Yehia, Tianyi Wang, Jiseop Byeon, Kun Qian, Christian Claudel (UT Austin 토목·건축·환경공학과), Junfeng Jiao (UT Austin 건축대학), Abduallah Mohamed (Meta Reality Labs)", "lead": "Meta Quest Pro 헤드셋을 쓴 75명이 실제 도심을 자유롭게 걸으며 수집한, 6DoF 머리 자세·3D 시선(gaze)·에고센트릭 RGB 영상·장면 주석을 시간 동기화해 담은 최초 규모의 1인칭(egocentric) 보행 궤적 예측 데이터셋을 공개하고, 여러 최신 예측 모델을 벤치마킹한 연구다.", "week": "2026-08-10", "report": "weekly/2026-08-10/2026-08-10_paper_summary.html"}, {"title": "EgoForce: Forearm-Guided Camera-Space 3D Hand Pose from a Monocular Egocentric Camera", "arxiv": "2605.12498", "topic": "Hand-Object Interaction", "pub": "2026-05-12", "venue": "SIGGRAPH 2026 (Conference Papers)", "authors": "Christen Millerdurai, Shaoxiang Wang, Yaxu Xie, Didier Stricker, Alain Pagani (독일인공지능연구소 DFKI, 카이저슬라우테른), Vladislav Golyanik (막스플랑크 정보학연구소 MPII, 자르브뤼켄)", "lead": "머리에 쓴 단일 RGB 카메라(예: Aria 안경) 영상 하나만으로, 손의 상대 자세뿐 아니라 카메라 좌표계에서의 절대 3D 손 위치·자세(6-DoF)를 복원하는 프레임워크로, 팔뚝(forearm)을 미분 가능한 단서로 활용해 단안 깊이-스케일 모호성을 줄이고, 다양한 렌즈(원근/어안/광각 왜곡)에 하나의 네트워크로 대응한다.", "week": "2026-08-10", "report": "weekly/2026-08-10/2026-08-10_paper_summary.html"}, {"title": "EgoEverything: A Benchmark for Human Behavior—Inspired Long-Context Egocentric Video Understanding in AR Environment", "arxiv": "2604.08342", "topic": "Egocentric Vision", "pub": "2026-04-09", "venue": "프리프린트", "authors": "Qiance Tang, Ziqi Wang (New York University), Jieyu Lin, Ziyun Li, Barbara De Salvo (Meta Reality Labs), Sai Qian Zhang (New York University)", "lead": "사람이 실제로 \"무엇을 봤는지(시선, gaze)\"를 반영해 질문을 만든, AR 환경용 장시간 1인칭(egocentric) 영상 이해 벤치마크로, 5,000개 넘는 객관식 문항과 100시간 이상 영상으로 최신 비전-언어 모델(VLM)이 아직 사람에 크게 못 미침을 보인다.", "week": "2026-08-10", "report": "weekly/2026-08-10/2026-08-10_paper_summary.html"}, {"title": "Spatial Interpolation of Room Impulse Responses based on Deeper Physics-Informed Neural Networks with Residual Connections", "arxiv": "2512.22915", "topic": "Spatial Audio", "pub": "2025-12 (프리프린트)", "venue": "프리프린트 (IEICE Transactions on Fundamentals of Electronics, Communications and Computer Sciences 투고)", "authors": "Ken Kurata, Gen Sato, Izumi Tsunokuni, Yusuke Ikeda (도쿄전기대학 / Tokyo Denki University, Japan)", "lead": "소수의 마이크 측정만으로 3차원 공간 전체의 RIR(공간 임펄스 응답, room impulse response)을 복원하기 위해, SIREN(사인 활성화 함수 기반 신경망)에 잔차 연결(residual connection)을 결합한 깊은 PINN(물리 정보 신경망, physics-informed neural network) 구조를 제안해 깊이를 늘려도 안정적으로 학습되고 반사음 성분까지 정확히 추정함을 보인 연구다.", "week": "2026-08-10", "report": "weekly/2026-08-10/2026-08-10_paper_summary.html"}, {"title": "HRTFformer: A Spatially-Aware Transformer for Individual HRTF Upsampling in Immersive Audio Rendering", "arxiv": "2510.01891", "topic": "Spatial Audio", "pub": "2025-10-02", "venue": "IEEE Transactions on Multimedia 2026 게재 확정 (저널)", "authors": "Xuyi Hu*, Jian Li*, Shaojie Zhang, Stefan Goetz, Lorenzo Picinali, Ozgur B. Akan, Aidan O. T. Hogg (*공동 1저자). 본문에 개별 소속 기관은 명시되지 않았으며, EU Horizon 2020 SONICOM 프로젝트(grant No. 101017743)의 지원을 받았다.", "lead": "희소하게 측정한 소수의 HRTF(머리 전달 함수, Head-Related Transfer Function)만으로 고해상도 개인 HRTF를 복원하는 문제를, 구면 조화(SH, Spherical Harmonic) 영역에서 동작하는 트랜스포머와 이웃 비유사도 손실(neighbour dissimilarity loss)로 풀어, 특히 극도로 희소한 조건에서 기존 방법 대비 음향적·지각적 정확도를 크게 끌어올린 연구다.", "week": "2026-08-10", "report": "weekly/2026-08-10/2026-08-10_paper_summary.html"}, {"title": "EgoPlay: 1인칭 영상 스트림을 위한 이벤트 기반 영상 편집", "arxiv": "2607.24560", "topic": "Egocentric Vision", "pub": "2026-07-27", "venue": "프리프린트 (ACM TOG 양식 사용, 발표처 미확정)", "authors": "Jinjie Mai(Snap Inc. / KAUST), Gordon Guocheng Qian, Willi Menapace, Arpit Sahni, Chaoyang Wang, Ashkan Mirzaei, Runjia Li, Sergey Tulyakov(이상 Snap Inc.), Bernard Ghanem(KAUST), Peter Wonka(Snap Inc. / KAUST), Rameen Abdal(Snap Inc., 교신저자)", "lead": "\"X라는 일이 벌어지면 Y를 하라\"는 조건부 지시만 주면, 1인칭(머리 착용 카메라 시점) 영상에서 그 사건이 언제 일어나는지를 스스로 알아내 사건 이전 프레임은 그대로 두고 이후 프레임에만 편집을 적용하는 단일 영상 편집 모델이다.", "week": "2026-08-03", "report": "weekly/2026-08-03/2026-08-03_paper_summary.html"}, {"title": "Unlocking Spatial Grounding in Large Audio-Visual Retrieval Models", "arxiv": "2607.24786", "topic": "Spatial Audio", "pub": "2026-07 (v1, arXiv ID 기준 · 아래 \"작성 메모\" 참고)", "venue": "프리프린트(Preprint)", "authors": "Hugo Malard, Michel Olvera, Sanjeel Parekh, Gaël Richard, Slim Essid, Stéphane Lathuilière — LTCI Télécom Paris, Meta Reality Labs Research, NVIDIA France, Inria(Université Grenoble Alpes)", "lead": "전역 정렬(global alignment)만 학습한 대규모 오디오-비주얼 검색(retrieval) 모델도, 중간 층(intermediate layer)의 시각 토큰에 남아 있는 공간 정보를 소리로 끌어내면 픽셀 단위 정답 없이도 \"소리 나는 곳\"을 정확히 찾아낼 수 있음을 보인 연구다.", "week": "2026-08-03", "report": "weekly/2026-08-03/2026-08-03_paper_summary.html"}, {"title": "Spatial-Omni: FOA 인코딩을 통한 멀티모달 LLM의 공간 오디오 이해 통합", "arxiv": "2606.10738", "topic": "Spatial Audio", "pub": "2026-06-09", "venue": "프리프린트 (eess.AS)", "authors": "Zhiyuan Zhu, Yixuan Chen, Yiwen Shao, Wenxiang Guo, Changhao Pan, Yu Zhang, Yuxiang Wang, Wei Liu, Houhua Zhang, Chengkuan Zeng, Wenbo Cheng, Yunxi Liu, Rui Yang, Steve Yves, Liefeng Bo, Zhou Zhao — 저장대학교(Zhejiang University), 텐센트 훈위안(Tencent Hunyuan)", "lead": "기존 멀티모달 LLM의 오디오 인코더를 건드리지 않고, 그 옆에 가벼운 공간 인코더(SO-Encoder)를 나란히 붙여 1차 앰비소닉(FOA) 공간 오디오를 \"독립적인 모달리티\"로 주입함으로써, 소리의 방향·거리·움직임·다중 음원 관계까지 이해하고 추론하게 만든 방법(Spatial-Omni)이다.", "week": "2026-08-03", "report": "weekly/2026-08-03/2026-08-03_paper_summary.html"}, {"title": "EgoExoMem: 동기화된 1인칭·3인칭 영상에 대한 교차 시점 기억 추론", "arxiv": "2605.18734", "topic": "Egocentric Vision", "pub": "2026-05-18", "venue": "프리프린트 (preprint)", "authors": "Ruiping Liu, Junwei Zheng, Yufan Chen, Di Wen, Shaofang Quan, Chengzhi Wu, Jiaming Zhang, Kailun Yang, Kunyu Peng, Rainer Stiefelhagen — Karlsruhe Institute of Technology(KIT), ETH Zurich, University of Oxford, Hunan University, INSAIT·Sofia University", "lead": "같은 사건을 동시에 찍은 1인칭(egocentric, 착용자 시점)과 3인칭(exocentric, 외부 카메라 시점) 영상을 하나의 \"이중 시점 기억\"으로 보고, 어느 한 시점만으로는 답할 수 없는 시공간 추론 문제를 평가하는 최초의 벤치마크 EgoExoMem과, 학습이 필요 없는 프레임 선택 기법 E2-Select를 제안한 논문이다.", "week": "2026-08-03", "report": "weekly/2026-08-03/2026-08-03_paper_summary.html"}, {"title": "합성 데이터를 활용한 1인칭 시점 손-물체 상호작용 검출 성능 향상 (Leveraging Synthetic Data for Enhancing Egocentric Hand-Object Interaction Detection)", "arxiv": "2603.29733", "topic": "Hand-Object Interaction", "pub": "2026-03-31", "venue": "프리프린트 (arXiv, cs.CV)", "authors": "Rosario Leonardi, Antonino Furnari, Francesco Ragusa, Giovanni Maria Farinella (University of Catania 수학·컴퓨터과학과 및 Next Vision s.r.l., 이탈리아 카타니아)", "lead": "1인칭 시점(egocentric, 카메라를 머리에 쓴 관점) 영상에서 손과 손이 만지는 물체를 검출하는 문제를, 자동 라벨링된 **합성 데이터(synthetic data)**와 **도메인 적응(domain adaptation, 학습 데이터와 실제 사용 데이터의 분포 차이를 좁히는 기법)**으로 풀 수 있음을 체계적으로 보이고, 이를 위한 데이터 생성 파이프라인과 HOI-Synth 벤치마크를 공개한 연구다.", "week": "2026-08-03", "report": "weekly/2026-08-03/2026-08-03_paper_summary.html"}, {"title": "HandX: Scaling Bimanual Motion and Interaction Generation", "arxiv": "2603.28766", "topic": "Hand-Object Interaction", "pub": "2026-03-30", "venue": "CVPR 2026", "authors": "Zimu Zhang, Yucheng Zhang, Xiyan Xu, Ziyin Wang, Sirui Xu, Kai Zhou, Bing Zhou, Chuan Guo, Jian Wang, Yu-Xiong Wang, Liang-Yan Gui / University of Illinois Urbana-Champaign(UIUC), Specs Inc., Snap Inc.", "lead": "두 손(bimanual)의 섬세한 손가락 움직임과 손과 손 사이의 접촉(inter-hand contact)까지 담아낸 대규모 데이터셋과 자동 주석 방식, 손 중심 평가지표를 하나로 묶고, 데이터·모델을 키울수록 성능이 좋아지는 \"스케일링(scaling)\" 경향을 텍스트 기반 양손 동작 생성에서 처음으로 체계적으로 보인 연구다.", "week": "2026-08-03", "report": "weekly/2026-08-03/2026-08-03_paper_summary.html"}, {"title": "S-EMBER: A Large-Scale Benchmark for Streaming Egocentric Memory Retrieval", "arxiv": "2607.02689", "topic": "Egocentric Vision", "pub": "2026-07-02", "venue": "프리프린트", "authors": "Xiaodong Wang, Xuanyi Zhao, Pedro Rodriguez, Devendra Singh Sachan, Barlas Oguz, Seungwhan Moon, Shang-Wen Li, Gargi Ghosh, Xin Dong, Wen-Tau Yih 외 (FAIR, Meta / Reality Labs, Meta)", "lead": "Ray-Ban Meta 스마트 안경으로 촬영한 388시간짜리 1인칭 영상에 기반해, AI가 \"스트리밍\" 상황에서 과거 경험을 떠올리고(episodic memory) 그 근거가 되는 영상 구간까지 정확히 짚어내야 하는 새로운 벤치마크 S-EMBER를 제안한 논문이다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "LIME: Learning Intent-aware Camera Motion from Egocentric Video", "arxiv": "2607.02417", "topic": "Egocentric Vision", "pub": "2026-07-02", "venue": "프리프린트", "authors": "Boyang Sun, Jiajie Li, Yung-Hsu Yang, Chenyangguang Zhang, Tim Engelbracht, Sunghwan Hong, Cesar Cadena, Marc Pollefeys, Hermann Blum (ETH Zurich, Microsoft, University of Bonn)", "lead": "사람이 찍은 일상 1인칭(egocentric) 영상만으로, \"자연어로 표현된 의도(intent)에 맞게 카메라를 어디로 움직여야 다음 관측이 더 유용한지\"를 학습하는 vision-language 모델 LIME을 제안한다. 즉 카메라 움직임 자체를 하나의 독립된 행동(action)으로 다룬다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "SpatialV2A: Visual-Guided High-fidelity Spatial Audio Generation", "arxiv": "2601.15017", "topic": "Spatial Audio", "pub": "2026-01-21", "venue": "프리프린트", "authors": "Yanan Wang, Linjie Ren, Zihao Li, Junyi Wang, Tian Gan (School of Computer Science and Technology, Shandong University / 산둥대학교)", "lead": "영상을 보고 소리를 만드는 Video-to-Audio(V2A, 영상→오디오 생성) 기술이 지금까지 놓쳤던 \"공간감(spatial perception)\"을 정면으로 다룬 연구다. 대규모 양이(binaural, 좌·우 두 채널로 방향감을 주는) 데이터셋 BinauralVGGSound를 새로 만들고, 영상 속 소리 위치 단서를 활용해 의미·시간 정합을 유지하면서도 입체적인 양이 오디오를 생성하는 SpatialV2A 프레임워크를 제안한다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "ViSAudio: End-to-End Video-Driven Binaural Spatial Audio Generation", "arxiv": "2512.03036", "topic": "Spatial Audio", "pub": "2025-12-02", "venue": "프리프린트 (arXiv, cs.CV)", "authors": "Mengchen Zhang(Zhejiang University, Shanghai AI Laboratory), Qi Chen(Shanghai Jiao Tong University, Shanghai Innovation Institute), Tong Wu(Stanford University), Zihan Liu(Beihang University, Shanghai AI Laboratory), Dahua Lin(Shanghai AI Laboratory, The Chinese University of Hong Kong)", "lead": "무음 영상만 보고 곧바로 좌우 두 귀에 맞는 입체 음향(binaural spatial audio, 두 귀로 듣는 것처럼 방향감이 있는 소리)을 만들어 내는 최초의 end-to-end 프레임워크로, 기존의 \"먼저 모노 소리를 만들고 나중에 공간화하는\" 2단계 방식이 겪던 오차 누적과 시공간 불일치 문제를 해결한다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "TOUCH: Text-guided Controllable Generation of Free-Form Hand-Object Interactions", "arxiv": "2510.14874", "topic": "Hand-Object Interaction", "pub": "2025-10-16", "venue": "프리프린트 (OpenReview 공개, 심사 중)", "authors": "Guangyi Han, Wei Zhai, Yuhang Yang, Yang Cao, Zheng-Jun Zha (University of Science and Technology of China, USTC)", "lead": "기존 손-물체 상호작용(HOI) 생성이 \"안정적으로 쥐기(grasping)\"에만 갇혀 있던 한계를 넘어, 밀기·찌르기·돌리기 같은 자유로운 일상 상호작용을 세밀한 텍스트 지시로 제어해 생성하는 새 과제(Free-Form HOI Generation)와, 이를 위한 인터넷 영상 기반 3D 데이터셋 WildO2, 그리고 접촉(contact)을 명시적으로 모델링하는 3단계 프레임워크 TOUCH를 제안한 연구다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "HORT: Monocular Hand-held Objects Reconstruction with Transformers", "arxiv": "2503.21313", "topic": "Hand-Object Interaction", "pub": "2025-03-27", "venue": "ICCV 2025", "authors": "Zerui Chen, Shizhe Chen, Cordelia Schmid (Inria, École normale supérieure, CNRS, PSL Research University), Rolandos Alexandros Potamias (Imperial College London)", "lead": "한 장의 RGB 이미지만으로 손에 쥔 물체의 3D 점군(point cloud, 물체 표면을 점들의 집합으로 나타낸 것)을 트랜스포머로 빠르고 정확하게 복원하는 방법으로, 성긴 점군에서 조밀한 점군으로 단계적으로 다듬는(coarse-to-fine) 전략과 손 기하 정보를 함께 활용해 기존 최고 성능(SOTA)을 능가하면서도 훨씬 빠른 추론 속도를 달성한다.", "week": "2026-07-27", "report": "weekly/2026-07-27/2026-07-27_paper_summary.html"}, {"title": "EgoGapBench: Benchmarking Egocentric Action Selection in Multi-Agent Scenes", "arxiv": "2607.00547", "topic": "Egocentric Vision", "pub": "2026-07-01", "venue": "프리프린트 (arXiv cs.CV, Comments 필드 확인 불가)", "authors": "Jihyeok Jung (KAIST AI), Jeewu Lee (Sogang University), Sanghyeop Kim (Sogang University), Chanhee Han (과학기술정보통신부), Seong Joon Oh (KAIST AI, 교신저자)", "lead": "1인칭 신체 단서를 없앤 다중 에이전트 장면에서 \"지금 내 시점에서 할 수 있는 행동\"을 고르게 하는 진단용 벤치마크를 만들어, 현재 MLLM이 사람과 크게 벌어질 뿐 아니라 남이 하고 있는 행동을 그대로 따라 고르는 구조적 실패를 보인다는 것을 밝힌 연구.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "EgoSAT: A Comprehensive Benchmark of Egocentric Streaming Interaction Understanding", "arxiv": "2606.24422", "topic": "Egocentric Streaming", "pub": "2026-06-23", "venue": "프리프린트 (cs.CV, v1 2026년 6월 23일 제출)", "authors": "Yijia Lei, Jinzhao Li(프로젝트 리드), Yichi Zhang, Jiacheng Hua, Yin Li, Miao Liu(교신) — 칭화대 College of AI, University of Wisconsin–Madison", "lead": "1인칭 영상이 실시간으로 흘러들어오는 상황에서 과거·현재·미래에 대한 질문을 하나의 스트리밍 틀로 묶어 평가하고, 정확도뿐 아니라 \"지금 이 질문에 답할 수 있는 상태인가(answerability)\"를 모델이 스스로 아는지까지 진단하는 첫 종합 벤치마크다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "What Should a Streaming Video Model Remember?", "arxiv": "2606.16353", "topic": "Egocentric Streaming", "pub": "2026-06-15", "venue": "프리프린트", "authors": "Haonan Ge, Yiwei Wang, Hang Wu, Yujun Cai (University of California, Santa Barbara / University of California, Merced / The University of Queensland)", "lead": "끊기지 않고 들어오는 영상 스트림에서 \"기억을 더 많이 쌓는 것\"이 아니라 \"정해진 예산 안에서 무엇을 어떻게 배분할 것인가\"로 문제를 다시 정의하고, 언제 쓸지·무엇을 남길지·어떻게 꺼낼지를 세 모듈로 나눠 처리하는 SelectStream을 제안해 StreamingBench 82.67%, OVO-Bench 67.03%를 달성한 연구다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Spatio-Temporal Audio Language Modeling for Dynamic Sound Sources", "arxiv": "2606.14141", "topic": "Spatial Audio", "pub": "2026-06-12", "venue": "프리프린트 (ACL 계열 양식, Limitations·Ethical Considerations 섹션 포함)", "authors": "Oh Hyun-Bin(POSTECH), Kazuki Shimada(Sony AI), Yuhta Takida(Sony AI), Kim Sung-Bin(POSTECH), Toshimitsu Uesaka(Sony AI), Takashi Shibuya(Sony AI), Kyeongyoon Lee(성균관대), Tae-Hyun Oh(KAIST, 교신), Yuki Mitsufuji(Sony AI / Sony Group, 교신)", "lead": "소리를 \"무슨 소리인가\"로만 보지 않고 시간에 따라 방향·거리가 변하는 **궤적을 가진 개체**로 다루기 위해, 움직이는 음원까지 포함한 앰비소닉 QA 벤치마크(ST-AudioQA), 시간 해상도를 가진 공간 오디오 인코더(ST-Audio Encoder), 그리고 이를 LLM에 붙인 ST-AudioLM을 함께 제안한 논문이다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "LUCID: Learning Embodiment-Agnostic Intent Models from Unstructured Human Videos for Scalable Dexterous Robot Skill Acquisition", "arxiv": "2606.11628", "topic": "Human-to-Robot Learning", "pub": "2026-06-10", "venue": "프리프린트", "authors": "Harsh Gupta (University of Illinois Urbana-Champaign), Guanya Shi (Carnegie Mellon University), Wenzhen Yuan (University of Illinois Urbana-Champaign)", "lead": "로봇 원격조작 데이터를 한 프레임도 쓰지 않고, 인터넷에 널린 사람 조작 영상에서 \"다음 1초 동안 장면이 어떻게 변해야 하는가\"라는 의도(intent)만 배우고, 그 의도를 실제 관절 명령으로 바꾸는 일은 대규모 병렬 시뮬레이션에서 따로 학습한 뒤 둘을 실시간 폐루프로 붙인 프레임워크다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Hand-centric Human-to-Robot Trajectory Transfer from Video Demonstrations via Open-World Contact Localization", "arxiv": "2606.10743", "topic": "Human-to-Robot Learning", "pub": "2026-06-09", "venue": "프리프린트", "authors": "Yitian Shi\\*, Di Wen\\*, Zhengqi Han, Zicheng Guo, Yu Hu, Edgar Welte, Kunyu Peng, Rainer Stiefelhagen, Rania Rayyes (Karlsruhe Institute of Technology, KIT / \\*공동 1저자)", "lead": "사람이 물건을 다루는 스테레오 영상 한 편에서 손 궤적을 복원하고, 물체 이름도 언어 프롬프트도 없이 \"언제 접촉이 시작되고 끝나는지\"를 찾아낸 뒤, 그 접촉 시작 프레임의 사람 파지 의도를 평행 그리퍼(parallel-jaw) 그랩으로 옮겨 실행 가능한 로봇 궤적 여러 개를 뽑아내는 프레임워크 HOWTransfer를 제안한다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Exploring Audio Hallucination in Egocentric Video Understanding", "arxiv": "2604.23860", "topic": "Egocentric Audio-Visual", "pub": "2026-04-26", "venue": "프리프린트 (arXiv cs.CV, v1 기준 / 4쪽 구성과 ABSTRACT 표기로 보아 음성·신호처리 학회 투고본 형식이나 Comments에 발표처 명시 없음)", "authors": "Ashish Seth (Meta / University of Maryland, College Park), Xinhao Mei, Changsheng Zhao, Varun Nagaraja, Ernie Chang, Gregory P. Meyer, Gael Le Lan, Yunyang Xiong, Vikas Chandra, Yangyang Shi, Zhipeng Cai (Meta), Dinesh Manocha (University of Maryland, College Park)", "lead": "1인칭(에고센트릭) 영상에서 오디오-비주얼 언어 모델이 \"화면에 보이니까 들렸을 것\"이라며 실제로 나지 않은 소리를 지어내는 현상(audio hallucination, 오디오 환각)을 처음으로 체계적으로 측정한 벤치마크로, Ego4D 300클립·1,000개 소리 질문을 만들어 최신 모델조차 환각 질문에서 27~40% 정확도에 그친다는 사실을 드러낸 논문.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "Do MLLMs Understand Pointing? Benchmarking and Enhancing Referential Reasoning in Egocentric Vision", "arxiv": "2604.21461", "topic": "Egocentric Vision", "pub": "2026-04-23", "venue": "프리프린트", "authors": "Chentao Li, Zirui Gao, Mingze Gao, Yinglian Ren, Jianjiang Feng(교신), Jie Zhou — 칭화대 자동화과 / 칭화대 미술디자인대", "lead": "1인칭 시점에서 사용자가 손가락으로 가리키는 대상을 MLLM이 제대로 짚어내는지 측정하는 벤치마크 EgoPoint-Bench(총 11.7k QA)를 만들고, 최신 모델들이 손가락 방향 대신 \"손 근처에 있는 물체\"나 \"눈에 띄는 물체\"를 고르는 지시 환각(Referential Hallucination)에 빠진다는 사실을 밝힌 뒤, 시뮬레이션 데이터 LoRA 파인튜닝으로 실환경까지 전이되는 성능 향상을 보인 연구다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "ForeHOI: Feed-forward 3D Object Reconstruction from Daily Hand-Object Interaction Videos", "arxiv": "2602.06226", "topic": "Hand-Object Interaction", "pub": "2026-02-05", "venue": "프리프린트 (arXiv, cs.CV)", "authors": "Yuantao Chen, Jiahao Chang, Chongjie Ye, Chaoran Zhang, Zhaojie Fang, Chenghong Li, Xiaoguang Han — SSE, CUHK-Shenzhen / FNii-Shenzhen / SDS, CUHK-Shenzhen", "lead": "손에 가려진 물체를 담은 일상 단안(monocular) 영상에서, 전처리 없이 1분 안에 물체의 완전한 3D 형상을 한 번에 뽑아내는 최초의 feed-forward 모델. 2D 마스크 채우기(inpainting)와 3D 형상 완성(shape completion)을 한 네트워크 안에서 동시에 풀어 가림(occlusion) 문제를 해결한다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "EgoAVU: Egocentric Audio-Visual Understanding", "arxiv": "2602.06139", "topic": "Egocentric Audio-Visual", "pub": "2026-02-05", "venue": "프리프린트", "authors": "Ashish Seth, Xinhao Mei, Changsheng Zhao, Varun Nagaraja, Ernie Chang, Gregory P. Meyer, Gael Le Lan, Yunyang Xiong, Vikas Chandra, Yangyang Shi, Dinesh Manocha, Zhipeng Cai (Meta, University of Maryland, College Park)", "lead": "1인칭(egocentric) 영상에서 소리와 화면을 함께 이해하는 학습 데이터가 없다는 문제를, 오픈소스 모델만으로 돌아가는 자동 데이터 생성 엔진 EgoAVU로 풀어낸 연구다. Ego4D 영상에서 300만 건 규모의 오디오-비주얼 질의응답(EgoAVU-Instruct)과 사람이 검수한 3천 건 벤치마크(EgoAVU-Bench)를 만들었고, 이 벤치마크가 현재 멀티모달 대형 언어 모델(MLLM)이 소리를 무시하고 화면에만 쏠려 있다는 사실을 드러낸다.", "week": "2026-07-20", "report": "weekly/2026-07-20/2026-07-20_paper_summary.html"}, {"title": "EgoSafetyBench: A Diagnostic Egocentric Video Benchmark for Evaluating Embodied VLMs as Runtime Safety Guards", "arxiv": "2607.00218", "topic": "Egocentric Vision", "pub": "2026-06-30", "venue": "프리프린트 (cs.CV, v1 2026년 6월 30일 제출)", "authors": "Siddhant Panpatil, Arth Singh (공동 1저자), Mijin Koo, Chaeyun Kim, Haon Park, Dasol Choi (교신) — AIM Intelligence, 서울대학교", "lead": "로봇 시점(1인칭) 영상 1,200개를 0.5초 단위로 라벨링해, 비전-언어 모델(VLM)이 실시간 안전 감시자(runtime safety guard) 역할을 할 때 위험을 \"언제\" 놓치는지와 장면 속 거짓 표지판에 얼마나 속는지를 갈라서 진단하는 벤치마크다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "EgoIntrospect: An Egocentric Dataset and Benchmark for User-Centric Internal State Reasoning", "arxiv": "2605.17262", "topic": "Egocentric Vision", "pub": "2026-05-17", "venue": "프리프린트", "authors": "Zeyu Wang, Chang Liu, Eduardus Tjitrahardja, Yuntao Wang, Borislav Pavlov, Fangfei Gou, Jose Manuel Davila, Dai Shi, Ran Xu, Yue Pan, Jiayi Tan, Shuting Chang, Qi Wang, Jinzhao Li, Jiacheng Hua, Yifei Huang, Jingwei Sun, Yu Zhang, Liuxin Zhang, Guocai Yao, Jia Jia, Yin Li, Qianying Wang, Yuanchun Shi, Miao Liu (Tsinghua University, Tongji University, Renmin University of China, The University of Tokyo, Lenovo Group, Peking University, University of Wisconsin–Madison, Shanghai Qi Zhi Institute)", "lead": "스마트 안경·스마트 워치·반지·손목밴드를 한꺼번에 착용한 60명이 각자의 일상을 180시간 촬영한 뒤 착용자 본인이 직접 자기 감정·요청 의도·기억 필요성을 라벨링한 최초의 1인칭(egocentric) 데이터셋을 만들고, 이 라벨로 멀티모달 대형 언어 모델(MLLM)이 사용자의 내적 상태(internal state)를 읽어낼 수 있는지 평가한 연구다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "Grasp in Gaussians: Fast Monocular Reconstruction of Dynamic Hand-Object Interactions", "arxiv": "2604.12929", "topic": "Hand-Object Interaction", "pub": "2026-04-14", "venue": "프리프린트", "authors": "Ayce Idil Aytekin, Xu Chen, Zhengyang Shen, Thabo Beeler, Helge Rhodin, Rishabh Dabral, Christian Theobalt (Max Planck Institute for Informatics / Saarbrücken Research Center for Visual Computing, Interaction and AI / Google / Bielefeld University)", "lead": "카메라 한 대로 찍은 영상에서 손과 물체의 3D 모양·움직임을 복원하되, 무거운 신경망 표현을 매 프레임 최적화하는 대신 생성형 3D 모델로 물체를 한 번만 만들어 두고 고전 기법인 Sum-of-Gaussians(가우시안 합) 추적으로 가볍게 따라가서, 기존 방법보다 6.4배 빠르면서 정확도까지 높인 방법이다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "FoleyDesigner: Immersive Stereo Foley Generation with Precise Spatio-Temporal Alignment for Film Clips", "arxiv": "2604.05731", "topic": "Spatial Audio", "pub": "2026-04-07", "venue": "프리프린트 (arXiv cs.CV, Comments 필드에 발표처 명시 없음)", "authors": "Mengtian Li, Kunyan Dai, Yi Ding, Ruobing Ni, Ying Zhang (Shanghai Film Academy, Shanghai University / Shanghai Engineering Research Center of Motion Picture Special Effects), Wenwu Wang (University of Surrey, UK), Zhifeng Xie (Shanghai University) — Wang, Xie가 교신저자", "lead": "무성 영화 클립을 입력받아, 인간 폴리 아티스트의 작업 순서(장면 분해 → 음향 제작 → 믹싱)를 그대로 모듈로 옮긴 뒤 영상에서 뽑은 깊이·방위각 궤적으로 diffusion을 조건화해, 화면 속 움직임과 프레임 단위로 맞물리는 스테레오 Foley를 만들고 5.1 서라운드까지 내보내는 프레임워크.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "AGILE: Hand-Object Interaction Reconstruction from Video via Agentic Generation", "arxiv": "2602.04672", "topic": "Hand-Object Interaction", "pub": "2026-02-04", "venue": "SIGGRAPH 2026 (Conference Papers)", "authors": "Jin-Chuan Shi, Binhong Ye, Tao Liu, Xiaoyang Liu, Yangjinhui Xu, Junzhe He, Zeju Li, Hao Chen, Chunhua Shen (State Key Lab of CAD & CG, Zhejiang University / Zhejiang University of Technology)", "lead": "단안(monocular) 영상에서 손-물체 상호작용을 복원할 때, 가려진 부분을 \"재구성\"으로 메우는 대신 VLM이 감독하는 생성(agentic generation)으로 완결된 물체 메시를 먼저 만들고, 접촉이 시작되는 한 프레임만 앵커로 잡아 추적하는 방식으로 SfM 의존성을 없앤 프레임워크다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "Residual Learning for Neural Ambisonics Encoders", "arxiv": "2601.18322", "topic": "Spatial Audio", "pub": "2026-01-26", "venue": "프리프린트 (Comments 필드 없음)", "authors": "Thomas Deppisch, Yang Gao, Manan Mittal, Benjamin Stahl, Christoph Hold, David Alon, Zamir Ben-Hur — 전원 Reality Labs Research, Meta (Deppisch는 Chalmers University of Technology, Mittal은 Stony Brook University 공동 소속)", "lead": "스마트글래스의 5채널 마이크 배열 신호를 Ambisonics로 변환할 때, 신경망이 선형 인코더를 대체하는 대신 그 출력에 더할 **보정항(residual)** 만 학습하도록 바꾸면 모든 지표에서 안정적으로 이득이 난다는 것을 실측 array transfer function 기반으로 보인 논문이다.", "week": "2026-07-19", "report": "weekly/2026-07-19/2026-07-19_paper_summary.html"}, {"title": "Improving and Evaluating Hand-Object Interaction Detection", "arxiv": "2606.17384", "topic": "Hand-Object Interaction", "pub": "2026-06-16", "venue": "프리프린트", "authors": "Ahmad Darkhalil (University of Bristol), Dima Damen (University of Bristol), David Fouhey (New York University)", "lead": "Transformer 기반 HOI-DETR 하나로 손, 손이 직접 잡은 물체(1st object), 도구를 거쳐 조작되는 물체(2nd object)와 이들 사이의 상호작용 관계까지 한꺼번에 검출하고, 여기에 정제한 데이터셋과 프레임/비디오 단위 평가 프로토콜을 함께 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "EgoPhys: Learning Generalizable Physics Models of Deformable Objects from Egocentric Video", "arxiv": "2606.16202", "topic": "Egocentric Vision", "pub": "2026-06-15", "venue": "프리프린트", "authors": "Hyunjin Kim, Ri-Zhao Qiu, Guangqi Jiang, Xiaolong Wang (UC San Diego)", "lead": "사람이 물체를 직접 만지며 촬영한 1인칭(egocentric) RGB 영상 한 편만으로 변형 물체(deformable object, 형태가 바뀌는 물체)의 물리적 디지털 트윈(physical digital twin, 실제 물체의 물리 거동을 그대로 재현하는 가상 모델)을 만들고, 코드북(codebook) 기반 물리 프라이어를 통해 처음 보는 물체에도 스프링별 재최적화 없이 곧바로 적용되는 물리 모델을 학습하는 프레임워크다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Probing Spatial Structure in Pretrained Audio Representations", "arxiv": "2606.05544", "topic": "Spatial Audio", "pub": "2026-06-04", "venue": "Interspeech 2026", "authors": "Chuyang Chen, Sivan Ding, Adrian S. Roman, Juan Pablo Bello (Music and Audio Research Laboratory, New York University, USA) — Chen, Ding, Roman은 공동 1저자", "lead": "사전학습된 오디오 모델의 frozen embedding에 공간(spatial) 정보가 얼마나 담겨 있는지를, 가벼운 linear probing(표현 안에 어떤 정보가 들어 있는지 진단하는 방법)으로 요인별로 나눠 측정하는 SARL(Spatial Audio Representation Learning) 벤치마크를 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "CHOIR: Contact-aware 4D Hand-Object Interaction Reconstruction", "arxiv": "2605.20992", "topic": "Hand-Object Interaction", "pub": "2026-05-20", "venue": "프리프린트", "authors": "Hao Xu (The Chinese University of Hong Kong), Yilin Liu (University College London), Yinqiao Wang (The Chinese University of Hong Kong), Chi-Wing Fu (The Chinese University of Hong Kong), Niloy J. Mitra (University College London, Adobe Research)", "lead": "한 대의 카메라로 찍은 단안(monocular) RGB 영상만으로 손의 관절 움직임, 물체의 형상과 6D 포즈 궤적, 접촉(손이 물체에 닿는 지점)을 한꺼번에 복원한다. 이때 접촉을 손과 물체를 잇는 명시적 신호로 삼아 둘의 정렬과 물리적 자연스러움을 끌어올리는 open-world 4D Hand-Object Interaction 복원 프레임워크다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Towards Streaming Synchronized Spatial Audio Generation via Autoregressive Diffusion Transformer", "arxiv": "2605.30940", "topic": "Spatial Audio", "pub": "2026-05", "venue": "프리프린트", "authors": "Ke Lei, Yu Zhang, Changhao Pan, Xueyi Pu, Wenxiang Guo, Ruiqi Li, Zhou Zhao (Zhejiang University 등; 제공된 본문 excerpt에는 개별 소속이 명시적으로 표기되어 있지 않음)", "lead": "360도 파노라마 비디오와 텍스트를 입력받아 4채널 FOA(First-Order Ambisonics, 1차 앰비소닉스) 공간 음향을 낮은 지연으로 스트리밍 생성하는 causal autoregressive diffusion transformer 프레임워크 SwanSphere를 제안한다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}, {"title": "Ego-1K – A Large-Scale Multiview Video Dataset for Egocentric Vision", "arxiv": "2603.13741", "topic": "Egocentric Vision", "pub": "2026-03-14", "venue": "프리프린트", "authors": "Jae Yong Lee, Daniel Scharstein, Akash Bapat, Hao Hu, Andrew Fu, Haoru Zhao, Paul Sammut, Xiang Li, Stephen Jeapes, Anik Gupta, Lior David, Saketh Madhuvarasu, Jay Girish Joshi, Jason Wither (전원 Meta Reality Labs 소속)", "lead": "사용자가 쓴 VR 헤드셋(카메라 4개)을 동기화된 카메라 12개로 빙 둘러싼 커스텀 rig로 촬영해, 시간이 맞춰진 egocentric(1인칭 시점) multiview 비디오 약 1,000개를 모은 데이터셋이다. neural 3D/4D video synthesis와 동적 장면 이해를 위한 벤치마크로 쓸 수 있다.", "week": "2026-07-18", "report": "weekly/2026-07-18/2026-07-18_paper_summary.html"}];
const COLORS = {"Hand-Object Interaction": "#10b981", "Egocentric Vision": "#0ea5e9", "Spatial Audio": "#6366f1", "Egocentric Streaming": "#64748b", "Human-to-Robot Learning": "#64748b", "Egocentric Audio-Visual": "#64748b"};
let activeTopic = "ALL";
let sortKey = "week", sortDir = -1;

function esc(s) { return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildChips() {
  const box = document.getElementById("chips");
  const topics = ["ALL", ...Object.keys(COLORS)];
  box.innerHTML = topics.map(t => {
    const c = t === "ALL" ? "#334155" : COLORS[t];
    const style = t === activeTopic ? `background:${c}` : "";
    const cls = t === activeTopic ? "chip active" : "chip";
    return `<span class="${cls}" style="${style}" onclick="setTopic('${t.replace(/'/g,"\\'")}')">${t==="ALL"?"전체":esc(t)}</span>`;
  }).join("");
}
function setTopic(t) { activeTopic = t; buildChips(); render(); }
function sortBy(k) { if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==="week"||k==="pub")?-1:1; } render(); }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let list = PAPERS.filter(p => activeTopic==="ALL" || p.topic===activeTopic);
  if (q) list = list.filter(p => (p.title+" "+p.authors+" "+p.arxiv+" "+p.venue+" "+p.lead).toLowerCase().includes(q));
  list.sort((a,b) => { const x=(a[sortKey]||""), y=(b[sortKey]||""); return x<y?-sortDir:x>y?sortDir:0; });
  const rows = document.getElementById("rows");
  rows.innerHTML = list.map(p => {
    const c = COLORS[p.topic] || "#64748b";
    const links = [];
    if (p.arxiv) {
      links.push(`<a href="https://arxiv.org/abs/${p.arxiv}" target="_blank">arXiv</a>`);
      links.push(`<a href="https://arxiv.org/pdf/${p.arxiv}" target="_blank">PDF</a>`);
    }
    if (p.report) links.push(`<a href="${esc(p.report)}#${""}" target="_blank">리포트</a>`);
    return `<tr>
      <td class="date">${esc(p.week)}</td>
      <td><span class="tp" style="background:${c}">${esc(p.topic)}</span></td>
      <td class="ttl">${esc(p.title)}${p.lead?`<span class="lead">${esc(p.lead)}</span>`:""}</td>
      <td class="date">${esc(p.pub)}</td>
      <td>${esc(p.venue)}</td>
      <td class="lk">${links.join("")}</td>
    </tr>`;
  }).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("count").textContent = `${list.length}편 / 전체 ${PAPERS.length}편`;
}
buildChips(); render();
</script>
